  if (s === null || s === undefined) return "";

const pad2 = (n) => String(n).padStart(2, "0");
function tarihStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function bugun() { return tarihStr(new Date()); }
function simdi() { const d = new Date(); return `${tarihStr(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function tarihTR(s) { if (!s) return "-"; const [t, saat] = String(s).split(/[ T]/); const [y,m,g] = t.split("-"); return `${g}.${m}.${y}${saat ? " " + saat.slice(0,5) : ""}`; }
function haftaEtiketi(dateStr) {
  if (!dateStr) return "";
  const secilen = new Date(dateStr + "T00:00:00");
  const gunIndex = (secilen.getDay() + 6) % 7;
  const start = new Date(secilen); start.setDate(secilen.getDate() - gunIndex);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  if (start.getMonth() === end.getMonth()) return `${start.getDate()}-${end.getDate()} ${AY_TAM[start.getMonth()]}`;
  return `${start.getDate()} ${AY_KISA[start.getMonth()]}-${end.getDate()} ${AY_KISA[end.getMonth()]}`;
}
function datetimeGoster(v) { return v ? v.replace("T", " ") : ""; }
function gunAdi(dateStr) { if (!dateStr) return ""; return GUNLER[new Date(dateStr + "T00:00:00").getDay()]; }
function tarihEkle(dateStr, gun) { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + gun); return tarihStr(d); }
function ayEkle(dateStr, ay) {
  const d = new Date(dateStr + "T00:00:00"); const g = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + ay);
  const sonGun = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(g, sonGun)); return tarihStr(d);
}

    const harcamaSayisi = 2 + (i % 4);

    }
  });

  const makeupRequests = [
    { id:"m1", studentId:"s2", ogretmenId:students.find(s=>s.id==="s2").teacherId, dersTarihi:"2026-06-11 17:00", sebep:"Sağlık raporu", onerilenTarih:"2026-06-14 16:00", durum:"beklemede" },

    { email:"kasa@7sanat.com.tr", sifre:"kasa123", rol:"kasa", ad:"Kafe Kasası", unvan:"Kasa (POS)" },
  ];
  return { teachers, students, makeupRequests, dersAtamaTalepleri, kartlar, kartHareketleri, personel, surumVeri: 2 };
}

function odemeOzeti(s) {
  const n = Math.max(1, s.taksitSayisi || 1);
  const taksitTutari = Math.round(s.kayitUcreti / n);
  const odenen = (s.odemeler || []).reduce((a, p) => a + (Number(p.tutar) || 0), 0);
  const kalan = Math.max(0, s.kayitUcreti - odenen);
  const BUGUN = bugun();
  let kumulatif = 0; const plan = []; let geciken = 0, odenenTaksit = 0;
  for (let i = 0; i < n; i++) {
    const tutar = i === n - 1 ? s.kayitUcreti - taksitTutari * (n - 1) : taksitTutari;
    const onceki = kumulatif; kumulatif += tutar;
    const vade = ayEkle(s.kayitTarihi, i);
    let durum;
    if (odenen >= kumulatif) { durum = "ödendi"; odenenTaksit++; }
    else if (vade < BUGUN) { durum = "gecikti"; geciken++; }
    else if (odenen > onceki) durum = "kısmi";
    else durum = "bekliyor";
    plan.push({ no: i + 1, vade, tutar, durum, kalan: Math.max(0, Math.min(tutar, kumulatif - odenen)) });
  }
  const genel = kalan <= 0 ? "tamamlandı" : geciken > 0 ? "gecikmiş" : "güncel";
  const sonraki = plan.find(p => p.durum !== "ödendi");
  return { taksitTutari, odenen, kalan, plan, geciken, odenenTaksit, durum: genel, sonraki };
}
function devamOrani(list) {
  if (!list || list.length === 0) return null;
  const sayilan = list.filter((d) => d[1] !== "mazeretli");
  if (!sayilan.length) return null;
  return Math.round((sayilan.filter((d) => d[1] === "var").length / sayilan.length) * 100);
}
function yasGrubu(yas) { if (yas <= 6) return "5-6"; if (yas <= 10) return "7-10"; if (yas <= 14) return "11-14"; return "15-18"; }
function kartBul(no) { return DB.kartlar.find(k => k.no === no); }
function kartHareketleri(no) { return DB.kartHareketleri.filter(h => h.kartNo === no).sort((a,b)=>b.tarih.localeCompare(a.tarih)); }
function kartBakiye(no) { return DB.kartHareketleri.filter(h => h.kartNo === no).reduce((a, h) => a + (h.tur === "yukleme" ? h.tutar : -h.tutar), 0); }
function ogretmenAd(tid) { const t = DB.teachers.find(x => x.id === tid); return t ? t.ad : null; }

/* Dosya indirme: uygulamada telefonun paylaş menüsü açılır (WhatsApp, Drive, e-posta...) */
async function dosyaPaylas(dosyaAdi, blob) {
  const fs = eklenti("Filesystem"), paylas = eklenti("Share");
  if (!fs || !paylas) { toast("Bu cihazda dosya paylaşımı desteklenmiyor.", "hata"); return; }
  try {
    const b64 = await new Promise((ok, hata) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = hata; r.readAsDataURL(blob); });
    const sonuc = await fs.writeFile({ path: dosyaAdi, data: b64, directory: "CACHE" });
    await paylas.share({ title: dosyaAdi, url: sonuc.uri, dialogTitle: "Dosyayı paylaş" });
  } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast("Dosya paylaşılamadı: " + ((e && e.message) || e), "hata"); }
}
async function uygulamaKurulum() {

  if (sb) { try { await sb.setStyle({ style: "DARK" }); await sb.setBackgroundColor({ color: "#0f131a" }); } catch (e) {} }
  const splash = eklenti("SplashScreen");
  if (splash) { try { await splash.hide(); } catch (e) {} }
  const app = eklenti("App");
  if (app) {
    // Android geri tuşu: önce açık pencereyi / menüyü kapat, sonra uygulamayı arka plana al
    app.addListener("backButton", () => {
      if (MODALLAR.length) modalKapat();

  }
}

async function callAI(system, user) {

  if (!resp.ok) throw new Error(data.error || "İstek başarısız: " + resp.status);

}
function parseJsonLoose(text) {
  const cleaned = text.replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf("{"), end = cleaned.lastIndexOf("}");
  if (start === -1 || end === -1) throw new Error("JSON bulunamadı");
  return JSON.parse(cleaned.slice(start, end + 1));
}

  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = dosyaAdi.endsWith(".xls") ? dosyaAdi : dosyaAdi + ".xls";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function xlsTablo(baslik, headers, rows) {

  return `${baslik ? `<h3 style="font-family:sans-serif;">${esc(baslik)}</h3>` : ""}<table border="1"><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead>
    <tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${h(c)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}">Kayıt yok</td></tr>`}</tbody></table><br/>`;
}

/* ---------- Öğretmen işlemleri ---------- */
function gonderTelafiTalebi(teacherId) {
  const sid = val("telafiOgrenci"), dersTarihi = datetimeGoster(val("telafiDersTarihi")), sebep = val("telafiSebep").trim(), onerilenTarih = datetimeGoster(val("telafiOnerilenTarih"));
  if (!sid || !dersTarihi || !sebep || !onerilenTarih) { toast("Lütfen tüm alanları doldurun.", "hata"); return; }
  DB.makeupRequests.push({ id: yeniId("m"), studentId: sid, ogretmenId: teacherId, dersTarihi, sebep, onerilenTarih, durum:"beklemede" });
  saveDb(); FORM_TEMIZLE = true; toast("Telafi talebi sekretere iletildi."); render();
}
function telafiDurumDegistir(id, d) { const r = DB.makeupRequests.find((x) => x.id === id); if (r) r.durum = d; saveDb(); toast(`Telafi talebi ${d}.`); render(); }
function gonderDersAtamaTalebi() {
  const studentId = val("dersAtamaOgrenci"), teacherId = val("dersAtamaOgretmen"), tarih = datetimeGoster(val("dersAtamaTarihi")), not_ = val("dersAtamaNot").trim();
  if (!studentId || !teacherId || !tarih) { toast("Lütfen öğrenci, öğretmen ve ders tarihi/saatini seçin.", "hata"); return; }
  const s = ogrenci(studentId), t = DB.teachers.find(x => x.id === teacherId);
  if (s.brans !== t.brans) { toast(`Branş uyuşmuyor: öğrenci ${s.brans}, öğretmen ${t.brans}.`, "hata"); return; }
  DB.dersAtamaTalepleri.push({ id: yeniId("d"), studentId, teacherId, tarih, not_, durum:"beklemede" });
  saveDb(); FORM_TEMIZLE = true; toast("Ders atama talebi yöneticiye iletildi."); render();
}
function dersAtamaDurumDegistir(id, d) {
  const r = DB.dersAtamaTalepleri.find((x) => x.id === id); if (!r) return;
  r.durum = d;
  if (d === "onaylandı") {
    const s = ogrenci(r.studentId), t = DB.teachers.find((x) => x.id === r.teacherId);
    if (s && t) { const [tk, sk] = r.tarih.split(" "); s.teacherId = t.id; s.grup = t.grup || null; s.dersGunu = gunAdi(tk); s.dersSaati = sk || s.dersSaati; }
  }
  saveDb(); toast(`Talep ${d}.`); render();
}

/* ---------- Yeni öğrenci kaydı ---------- */
function yeniBransDegisti(b) { const u = document.getElementById("yeniUcret"); if (u && BRANS_BILGI[b]) u.value = BRANS_BILGI[b].ucret; }
function kaydetYeniOgrenci() {
  const ad = val("yeniAd").trim(), yas = Number(val("yeniYas")), brans = val("yeniBrans"), kayitTarihi = val("yeniTarih");
  const kayitUcreti = Number(val("yeniUcret")), taksitSayisi = Number(val("yeniTaksit"));
  const veliAd = val("yeniVeliAd").trim(), veliTel = val("yeniVeliTel").trim(), veliEmail = val("yeniVeliEmail").trim();
  const ilkOdeme = Number(val("yeniIlkOdeme")) || 0, ilkBakiye = Number(val("yeniIlkBakiye")) || 0;
  if (!ad || !yas || !kayitTarihi || !kayitUcreti || !veliAd || !veliTel) { toast("Lütfen * işaretli tüm alanları doldurun.", "hata"); return; }
  if (sadeceRakam(veliTel).length < 10) { toast("Veli telefonu en az 10 haneli olmalı.", "hata"); return; }
  if (ilkOdeme > kayitUcreti) { toast("Peşinat kayıt ücretinden fazla olamaz.", "hata"); return; }
  const tc = sadeceRakam(val("yeniTC"));
  if (!tcGecerli(tc)) { toast("Öğrencinin geçerli TC kimlik numarasını girin.", "hata"); return; }
  const ogrEmail = (val("yeniOgrEmail").trim() || ogrenciEpostaUret(ad)).toLowerCase();
  if (!/^[a-z0-9._-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(ogrEmail)) { toast("Öğrenci e-postası geçersiz.", "hata"); return; }
  if (epostaKullaniliyor(ogrEmail)) { toast("Bu öğrenci e-postası zaten kullanılıyor.", "hata"); return; }
  const veliSoruCevap = VELI_SORULARI.map((soru, i) => [soru, val("veliCevap" + i).trim()]).filter((qa) => qa[1]);
  const tel = sadeceRakam(veliTel).replace(/^(?!0)/, "0");
  const kardes = DB.students.find(s => s.veli && telEsit(s.veli.tel, tel));
  const veliSifre = kardes ? kardes.veli.sifre : sifreUret();
  const no = kartNoUret();
  const s = {
    id: yeniId("s"), ad, yas, brans, grup:null, kayitTarihi, kayitUcreti, taksitSayisi,
    odemeler: ilkOdeme > 0 ? [{ id: yeniId("o"), tarih: kayitTarihi, tutar: ilkOdeme, yontem: val("yeniIlkOdemeYontem"), not_:"Kayıt peşinatı", alan: USER.ad }] : [],
    teacherId:null, dersGunu:null, dersSaati:null,
    ilgiAlani: veliSoruCevap[0] ? veliSoruCevap[0][1] : "", beklenti: veliSoruCevap.length ? veliSoruCevap[veliSoruCevap.length-1][1] : "",
    seviye: val("yeniSeviye") || "Başlangıç", veliSoruCevap, haftalikNotlar:[], devam:[],
    veli: { ad: veliAd, tel, email: veliEmail, sifre: veliSifre }, kartNo: no,
    hesap: { email: ogrEmail, sifreOzet: sifreOzet(tc.slice(0, 6)), ilkSifre: true, sonGiris: null },
    eserler: [], mufSeviye: brans === "Piyano" ? ({ "Başlangıç": 1, "Orta": 2, "İleri": 3 }[val("yeniSeviye")] || 1) : null,
  };
  DB.students.push(s);
  DB.kartlar.push({ no, tip: YENI_KART_TIP, studentId: s.id, olusturma: kayitTarihi, aktif: true });
  if (ilkBakiye > 0) DB.kartHareketleri.push({ id: yeniId("h"), kartNo: no, tarih: simdi(), tur:"yukleme", tutar: ilkBakiye, aciklama:"Açılış bakiyesi", kopya:null, islemYapan: USER.ad });
  saveDb(); FORM_TEMIZLE = true;
  modalAc({ tip:"kayitSonuc", sid: s.id, kardes: !!kardes });
}

/* ---------- Şifre özeti (SHA-256, saf JS — http üzerinde de çalışır) ---------- */
function sha256(ascii) {
  const r = (v, a) => (v >>> a) | (v << (32 - a));
  const bytes = new TextEncoder().encode(ascii);
  const K = [], H = [];
  let p = 2;
  for (let c = 0; c < 64; p++) {
    let asal = true; for (let i = 2; i * i <= p; i++) if (p % i === 0) { asal = false; break; }
    if (!asal) continue;
    if (c < 8) H[c] = (Math.pow(p, 1 / 2) * 4294967296) | 0;
    K[c++] = (Math.pow(p, 1 / 3) * 4294967296) | 0;
  }
  const l = bytes.length, bl = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(bl);
  m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(bl - 4, l * 8);
  const w = new Array(64);
  for (let j = 0; j < bl; j += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(j + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
const sifreOzet = (s) => sha256("7sanat|" + s);

/* TC kimlik no doğrulama (resmi algoritma). TC'nin kendisi sistemde saklanmaz. */
function tcGecerli(tc) {
  if (!/^[1-9]\d{10}$/.test(tc)) return false;
  const d = tc.split("").map(Number);
  const on = ((d[0] + d[2] + d[4] + d[6] + d[8]) * 7 - (d[1] + d[3] + d[5] + d[7])) % 10;
  const onbir = d.slice(0, 10).reduce((a, b) => a + b, 0) % 10;
  return ((on + 10) % 10) === d[9] && onbir === d[10];
}

function epostaKullaniliyor(email, haricSid) {

function mebPiyanoMufredat() { const m = JSON.parse(JSON.stringify(MEB_PIYANO_MUFREDAT)); m.aciklama = "Kaynak: " + m.kaynak; return m; }

function ogrSeviye(s) { const m = mufredat(s.brans); if (!m) return null; const n = s.mufSeviye || 1; return m.seviyeler.find(x => x.no === n) ? n : m.seviyeler[0].no; }
function seviyeBul(brans, no) { const m = mufredat(brans); return m ? m.seviyeler.find(x => x.no === no) || null : null; }
function seviyeKonulari(brans, no) { const sv = seviyeBul(brans, no); return sv ? sv.haftalar.flatMap(h => h.konular.map(k => ({ ...k, hafta: h.no }))) : []; }
function konuAd(brans, id) { const m = mufredat(brans); if (!m) return null; for (const sv of m.seviyeler) for (const h of sv.haftalar) { const k = h.konular.find(x => x.id === id); if (k) return k.ad; } return null; }
function haftaBaslik(h) { return h.baslik || (h.konular[0] ? h.konular[0].ad : "—"); }
function ogrenciKayitlari(sid) { return (DB.dersKayitlari || []).filter(k => k.ogrenciler && k.ogrenciler[sid]).sort((a, b) => b.tarih.localeCompare(a.tarih)); }
function islenenKonular(sid) {
  const set = new Set();
  ogrenciKayitlari(sid).forEach(k => { if (k.ogrenciler[sid].durum === "var") (k.konular || []).forEach(id => set.add(id)); });
  return set;
}
function mufredatIlerleme(s) {
  const no = ogrSeviye(s); if (!no) return null;
  const tum = seviyeKonulari(s.brans, no); if (!tum.length) return { seviye: no, yuzde: 0, islenen: 0, toplam: 0, siradaki: null };
  const isl = islenenKonular(s.id);
  const n = tum.filter(k => isl.has(k.id)).length;
  const siradaki = seviyeBul(s.brans, no).haftalar.find(h => h.konular.some(k => !isl.has(k.id)));
  return { seviye: no, yuzde: Math.round((n / tum.length) * 100), islenen: n, toplam: tum.length, siradaki };
}
function ilerlemeCubugu(s, kompakt) {

}

function goc3(db) {

  const alan = (e) => String(e || "").replace(/@7sanat\.com$/i, "@" + EPOSTA_ALANI);
  db.personel.forEach(p => p.email = alan(p.email));
  db.teachers.forEach(t => t.email = alan(t.email));
  db.mufredat = db.mufredat || { Piyano: mebPiyanoMufredat() };
  db.dersKayitlari = db.dersKayitlari || [];
  const eskiDB = DB; DB = db;
  db.students.forEach((s, i) => {
    s.eserler = s.eserler || [];
    if (s.brans === "Piyano" && !s.mufSeviye) s.mufSeviye = s.seviye === "İleri" ? 3 : s.seviye === "Orta" ? 2 : 1;
    if (!s.hesap) s.hesap = { email: ogrenciEpostaUret(s.ad, s.id), sifreOzet: sifreOzet("123456"), ilkSifre: true, sonGiris: null };

function demoDersVerisi(db) {
  const eserHavuzu = [["Minuet in G", "J. S. Bach"], ["Arabesk Op. 100 No. 2", "F. Burgmüller"], ["Sonatin Op. 36 No. 1", "M. Clementi"], ["Für Elise", "L. v. Beethoven"], ["Etüt Op. 599 No. 12", "C. Czerny"], ["Vals Op. 39 No. 15", "J. Brahms"]];
  const piyanocular = db.students.filter(s => s.brans === "Piyano" && s.teacherId && s.dersGunu);
  piyanocular.forEach((s, i) => {
    const sv = seviyeBul("Piyano", s.mufSeviye || 1) || seviyeBul("Piyano", 1);
    const hBas = 2 + (i % 5);
    s.eserler = eserHavuzu.slice(i % 3, i % 3 + 3).map(([ad, besteci], j) => ({ id: yeniId("e"), ad, besteci, durum: ["tamamlandi", "calisiliyor", "calisiliyor"][j], tarih: tarihEkle(bugun(), -40 + j * 14) }));
    if (i % 4 === 0) s.eserler[0].durum = "konser";
    [-3, -2, -1, 0].forEach((hafta, hi) => {
      const tarih = tarihEkle(haftaninGunu(s.dersGunu), hafta * 7);
      if (tarih > bugun()) return;
      const durum = (i + hi) % 7 === 3 ? "mazeretli" : "var";
      const kon = (sv.haftalar[hBas + hi] || sv.haftalar[0]).konular.slice(0, 3).map(k => k.id);
      const mat = [{ id: yeniId("m"), dosyaId: "demo-nota", ad: "Do Pozisyonu Etüdü.svg", tur: "nota", boyut: 2100, mime: "image/svg+xml" }];
      if (hi % 2 === 0) mat.push({ id: yeniId("m"), dosyaId: "demo-not", ad: "Ders Notu - Oturuş ve El Pozisyonu.txt", tur: "not", boyut: 420, mime: "text/plain" });
      const puan = 3 + ((i + hi) % 3);
      const k = {
        id: yeniId("dk"), tarih, saat: s.dersSaati, teacherId: s.teacherId, grup: null,
        ogrenciler: { [s.id]: { durum, puan: durum === "var" ? puan : null } },
        degerlendirme: durum === "var" ? ["Derse hazırlıklı geldi, parmak pozisyonunda ilerleme var.", "Ritim konusunda biraz zorlandı, evde metronomla çalışmalı.", "Çok keyifli bir dersti; yeni parçaya hızlı başladı.", "Eller birlikte çalarken dikkat dağılıyor, yavaş tempo öneriyorum."][(i + hi) % 4] : "",
        konular: durum === "var" ? kon : [],
        islenen: durum === "var" ? "Isınma: 5 parmak egzersizi. Ardından parça çalışması ve yeni konunun anlatımı." : "",
        odev: durum === "var" ? ["Do pozisyonu etüdünü günde 15 dk, eller ayrı çalış.", "Yeni parçanın ilk 8 ölçüsünü yavaş tempoda çalış.", "Do majör diziyi sağ ve sol elle 5'er kez çal.", "Ritim sayarak 2. satırı ezberle."][(i + hi) % 4] : "",
        materyaller: durum === "var" ? mat : [],
        olusturma: tarih + " 19:00", guncelleme: null,
      };
      db.dersKayitlari.push(k);
      s.devam = s.devam.filter(d => d[0] !== tarih); s.devam.push([tarih, durum]); s.devam.sort((a, b) => a[0].localeCompare(b[0]));
      if (durum === "var") { const hEt = haftaEtiketi(tarih); s.haftalikNotlar = s.haftalikNotlar.filter(n => n[0] !== hEt); s.haftalikNotlar.push([hEt, k.degerlendirme, puan]); }
    });
  });
  // Demo öğrenci hesabı: ilk piyano öğrencisi şifre değiştirmeden girebilsin
  if (piyanocular[0]) piyanocular[0].hesap.ilkSifre = false;
}

/* Ders Kaydı penceresi (öğretmen)                                      */

function dersKaydiBul(teacherId, tarih, sids) { return (DB.dersKayitlari || []).find(k => k.teacherId === teacherId && k.tarih === tarih && sids.some(s => k.ogrenciler[s])); }
function dersKaydiAc(teacherId, tarih, sidsCsv, kayitId) {
  let k = kayitId ? DB.dersKayitlari.find(x => x.id === kayitId) : null;
  const sids = k ? Object.keys(k.ogrenciler) : sidsCsv.split(",").filter(Boolean);
  if (!k) k = dersKaydiBul(teacherId, tarih, sids);
  const tumSids = k ? [...new Set([...Object.keys(k.ogrenciler), ...sids])] : sids;
  const durumlar = {}, puanlar = {};
  tumSids.forEach(sid => {
    const o = k && k.ogrenciler[sid];
    const s = ogrenci(sid); const eski = s && (s.devam.find(d => d[0] === (k ? k.tarih : tarih)) || [])[1];
    durumlar[sid] = o ? o.durum : (eski || null);
    puanlar[sid] = o ? o.puan : null;
  });
  const ilk = ogrenci(tumSids[0]);
  const p = ilk && mufredatIlerleme(ilk);
  modalAc({
    tip: "dersKaydi", teacherId: k ? k.teacherId : teacherId, tarih: k ? k.tarih : tarih, sids: tumSids, kayitId: k ? k.id : null,
    durumlar, puanlar, telafi: {}, konular: k ? [...(k.konular || [])] : [], materyaller: k ? JSON.parse(JSON.stringify(k.materyaller || [])) : [],
    seviye: ilk ? ogrSeviye(ilk) : null, acikHafta: p && p.siradaki ? p.siradaki.no : 1, yukleniyor: false,
    ilkDeger: k ? { degerlendirme: k.degerlendirme, islenen: k.islenen, odev: k.odev } : { degerlendirme: "", islenen: "", odev: "" },
  });
}
function dkUst() { return MODALLAR[MODALLAR.length - 1]; }
function dkDurum(sid, d) { const m = dkUst(); m.durumlar[sid] = d; if (d !== "var") m.puanlar[sid] = null; render(); }
function dkHepsiGeldi() { const m = dkUst(); m.sids.forEach(s => m.durumlar[s] = "var"); render(); }
function dkPuan(sid, p) { const m = dkUst(); m.puanlar[sid] = m.puanlar[sid] === p ? null : p; render(); }
function dkTelafi(sid) { const m = dkUst(); m.telafi[sid] = !m.telafi[sid]; render(); }
function dkSeviye(no) { const m = dkUst(); m.seviye = Number(no); m.acikHafta = 1; render(); }
function dkHafta(no) { const m = dkUst(); m.acikHafta = m.acikHafta === no ? null : no; render(); }
function dkKonu(id) { const m = dkUst(); const i = m.konular.indexOf(id); if (i >= 0) m.konular.splice(i, 1); else m.konular.push(id); render(); }
function dkMateryalCikar(id) { const m = dkUst(); m.materyaller = m.materyaller.filter(x => x.id !== id); render(); }
async function dkMateryalYukle() {
  const m = dkUst(); const input = document.getElementById("dkDosya"); const tur = val("dkTur");
  const dosyalar = input ? [...input.files] : [];
  if (!dosyalar.length) { toast("Önce dosya seçin.", "hata"); return; }
  if (!SUNUCU) { toast("Dosya yüklemek için sunucuya bağlı olmalısınız (npm start).", "hata"); return; }
  const buyuk = dosyalar.find(f => f.size > DOSYA_SINIRI);
  if (buyuk) { toast(`"${buyuk.name}" 25 MB sınırını aşıyor.`, "hata"); return; }
  m.yukleniyor = true; render();
  let basarili = 0;
  for (const f of dosyalar) {
    try {
      const r = await fetch(api("/api/dosya"), { method: "POST", headers: { "Content-Type": f.type || "application/octet-stream", "X-Dosya-Adi": encodeURIComponent(f.name) }, body: f });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "yükleme başarısız");
      m.materyaller.push({ id: yeniId("m"), dosyaId: j.id, ad: f.name, tur, boyut: f.size, mime: f.type, yuklenme: simdi() });
      basarili++;
    } catch (e) { toast(`"${f.name}" yüklenemedi: ${e.message}`, "hata"); }
  }
  m.yukleniyor = false;
  const el = document.getElementById("dkDosya"); if (el) el.value = "";
  if (basarili) toast(`${basarili} dosya eklendi (${MATERYAL_TUR[tur].ad}). Kaydetmeyi unutmayın.`);
  render();
}
function dersKaydiKaydet() {
  const m = dkUst();
  const eksik = m.sids.filter(s => !m.durumlar[s]);
  if (eksik.length) { toast(`Yoklama eksik: ${eksik.map(s => (ogrenci(s) || {}).ad).join(", ")}`, "hata"); return; }
  const degerlendirme = val("dkDegerlendirme").trim(), islenen = val("dkIslenen").trim(), odev = val("dkOdev").trim();
  const gelen = m.sids.filter(s => m.durumlar[s] === "var");
  if (gelen.length && !degerlendirme) { toast("Dersin nasıl geçtiğini kısaca yazın.", "hata"); return; }
  for (const sid of m.sids) if (m.durumlar[sid] === "mazeretli" && m.telafi[sid] && !val("dkTelafiTarih_" + sid)) { toast("Telafi için önerilen tarih/saati seçin.", "hata"); return; }
  const t = DB.teachers.find(x => x.id === m.teacherId);
  const ilkOgr = ogrenci(m.sids[0]);
  let k = m.kayitId && DB.dersKayitlari.find(x => x.id === m.kayitId);
  if (!k) { k = { id: yeniId("dk"), olusturma: simdi() }; DB.dersKayitlari.push(k); }
  Object.assign(k, {
    tarih: m.tarih, saat: ilkOgr ? ilkOgr.dersSaati : null, teacherId: m.teacherId, grup: t ? t.grup || null : null,
    ogrenciler: Object.fromEntries(m.sids.map(s => [s, { durum: m.durumlar[s], puan: m.puanlar[s] || null }])),
    degerlendirme, konular: [...m.konular], islenen, odev, materyaller: m.materyaller, guncelleme: m.kayitId ? simdi() : null,
  });
  // Yoklama, haftalık gelişim notu ve telafi taleplerine işle
  const hEt = haftaEtiketi(m.tarih);
  m.sids.forEach(sid => {
    const s = ogrenci(sid); if (!s) return;
    s.devam = s.devam.filter(d => d[0] !== m.tarih); s.devam.push([m.tarih, m.durumlar[sid]]); s.devam.sort((a, b) => a[0].localeCompare(b[0]));
    if (m.durumlar[sid] === "var" && (m.puanlar[sid] || degerlendirme)) {
      s.haftalikNotlar = s.haftalikNotlar.filter(n => n[0] !== hEt);
      s.haftalikNotlar.push([hEt, degerlendirme, m.puanlar[sid] || 3]);
    }
    if (m.durumlar[sid] === "mazeretli" && m.telafi[sid]) {
      DB.makeupRequests.push({ id: yeniId("m"), studentId: sid, ogretmenId: m.teacherId, dersTarihi: `${m.tarih} ${s.dersSaati || ""}`.trim(), sebep: val("dkTelafiSebep_" + sid).trim() || "Mazeretli devamsızlık", onerilenTarih: datetimeGoster(val("dkTelafiTarih_" + sid)), durum: "beklemede" });
    }
  });
  if (m.sids.length === 1 && m.seviye && ilkOgr && ilkOgr.mufSeviye !== m.seviye && mufredat(ilkOgr.brans)) ilkOgr.mufSeviye = m.seviye;
  saveDb(); FORM_TEMIZLE = true; MODALLAR.pop();
  toast(`${tarihTR(m.tarih)} ders kaydı kaydedildi${Object.values(m.telafi).some(Boolean) ? " · telafi talebi sekretere iletildi" : ""}.`);
  render();
}

  SIFRE_HATA = "";
  if (a.length < 6) SIFRE_HATA = "Şifre en az 6 karakter olmalı.";
  else if (a !== b) SIFRE_HATA = "Şifreler aynı değil.";
  else if (sifreOzet(a) === s.hesap.sifreOzet) SIFRE_HATA = "Yeni şifre ilk şifreyle aynı olamaz.";
  else if (/^\d{6}$/.test(a)) SIFRE_HATA = "Sadece 6 rakamdan oluşan şifre olmaz; harf de ekle.";
  if (SIFRE_HATA) { render(); return; }
  s.hesap.sifreOzet = sifreOzet(a); s.hesap.ilkSifre = false; s.hesap.sonGiris = simdi();
  USER.sifreDegistir = false; oturumAc(USER); saveDb(); FORM_TEMIZLE = true; toast("Şifren kaydedildi. Hoş geldin!"); render();
}

let MUF_BRANS = "Piyano", MUF_SEVIYE = 1;
function eksikDersKayitlari() {
  const sonuc = [];
  const bas = haftaBasi(bugun());
  DB.teachers.forEach(t => {
    const ogr = DB.students.filter(s => s.teacherId === t.id && s.dersGunu);
    let eksik = [];
    if (t.grup) {
      [...new Set(ogr.map(s => s.dersGunu))].forEach(g => {
        const tarih = haftaninGunu(g, bas); if (!tarih || tarih > bugun()) return;
        const ids = ogr.filter(s => s.dersGunu === g).map(s => s.id);
        if (!dersKaydiBul(t.id, tarih, ids)) eksik.push(`${t.grup} · ${tarihTR(tarih)}`);
      });
    } else ogr.forEach(s => {
      const tarih = haftaninGunu(s.dersGunu, bas); if (!tarih || tarih > bugun()) return;
      if (!dersKaydiBul(t.id, tarih, [s.id])) eksik.push(`${s.ad} · ${tarihTR(tarih)}`);
    });
    if (eksik.length) sonuc.push({ t, eksik });
  });
  return sonuc.sort((a, b) => b.eksik.length - a.eksik.length);
}
function eksikKayitKarti() {
  const liste = eksikDersKayitlari();
  const toplam = liste.reduce((a, x) => a + x.eksik.length, 0);
  return card(`${cardBaslik("clipboard", "Bu Hafta Ders Kaydı Girilmemiş", toplam ? badge("orange", toplam + " ders") : badge("success", "Tamam"))}
    <div class="space-y-2 max-h-72 overflow-y-auto">${liste.map(({ t, eksik }) => `<details class="bg-bg rounded-lg"><summary class="cursor-pointer list-none p-3 flex items-center justify-between gap-3"><span class="text-sm">${esc(t.ad)} <span class="text-xs text-mut">(${esc(t.brans)})</span></span><span class="text-xs text-orange-400">${eksik.length} eksik</span></summary>
      <div class="px-3 pb-3 text-xs text-mut space-y-1">${eksik.map(e => `<p>• ${esc(e)}</p>`).join("")}</div></details>`).join("") || bos("Bu haftanın tüm dersleri kayıtlı.")}</div>`);
}

    <div class="xl:col-span-2">${editor}</div>
    <div class="space-y-6">${mufIlerlemeRaporu()}</div>

function mufIlerlemeRaporu() {
  const satirlar = DB.teachers.filter(t => mufredat(t.brans)).map(t => {

    const son = (DB.dersKayitlari || []).filter(k => k.teacherId === t.id).sort((a, b) => b.tarih.localeCompare(a.tarih))[0];
    return { t, n: ogr.length, ort, son };
  });
  const branslar = BRANSLAR().filter(mufredat).map(b => { const o = DB.students.filter(s => s.brans === b && s.teacherId); return [b, o.length ? Math.round(o.reduce((a, s) => a + (mufredatIlerleme(s) || { yuzde: 0 }).yuzde, 0) / o.length) : 0, o.length]; });
  const cubuk = (y) => `<div class="h-1.5 rounded-full bg-bg mt-1.5"><div class="h-1.5 rounded-full bg-gold" style="width:${y}%"></div></div>`;
  return card(`${cardBaslik("trend", "İlerleme — Branş")}${branslar.map(([b, y, n]) => `<div class="mb-3"><div class="flex justify-between text-sm"><span>${esc(b)} <span class="text-xs text-mut">${n} öğrenci</span></span><span class="text-gold">%${y}</span></div>${cubuk(y)}</div>`).join("") || bos("Müfredatı olan branş yok.")}`)

}
function mufOlustur() { DB.mufredat[MUF_BRANS] = { aciklama: "", seviyeler: [{ no: 1, ozet: "", haftalar: [{ no: 1, donem: 1, konular: [] }] }] }; MUF_SEVIYE = 1; saveDb(); render(); }
function mufSv(si) { return DB.mufredat[MUF_BRANS].seviyeler[si]; }
function mufSeviyeEkle() { const m = DB.mufredat[MUF_BRANS]; const no = Math.max(...m.seviyeler.map(x => x.no)) + 1; m.seviyeler.push({ no, ozet: "", haftalar: [{ no: 1, donem: 1, konular: [] }] }); MUF_SEVIYE = no; saveDb(); render(); }
function mufSeviyeOzet(si, v) { mufSv(si).ozet = v.trim(); saveDb(); }
function mufHaftaEkle(si) { const sv = mufSv(si); sv.haftalar.push({ no: sv.haftalar.length + 1, donem: sv.haftalar.length < 20 ? 1 : 2, konular: [] }); saveDb(); render(); }
function mufHaftaSil(si, hi) { const sv = mufSv(si); sv.haftalar.splice(hi, 1); sv.haftalar.forEach((h, i) => h.no = i + 1); saveDb(); render(); }
function mufKonuEkle(si, hi) {
  const ad = val("mufYeni_" + hi).trim(); if (!ad) return;

  return `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      ${mufredat(s.brans) ? `<div class="flex items-center gap-2 mt-3"><span class="text-xs text-mut">Müfredat seviyesi</span><select onchange="ogrSeviyeAyarla('${s.id}', this.value)" class="${INP} !w-auto !py-1 !text-xs">${mufredat(s.brans).seviyeler.map(x => `<option value="${x.no}" ${x.no === ogrSeviye(s) ? "selected" : ""}>${x.no}. Seviye</option>`).join("")}</select></div>` : ""}</div>
      <div><div class="flex items-center justify-between mb-2"><p class="text-sm font-medium">Çaldığı Eserler</p><button onclick="eserAc('${s.id}')" class="${BTN.s}">${ikon("edit", "w-3.5 h-3.5")} Düzenle</button></div>${eserListesi(s, false)}</div></div>
    <div><p class="text-sm font-medium mb-2">Ders Kayıtları (${kayitlar.length})</p><div class="space-y-3">${kayitlar.slice(0, 10).map(k => dersKaydiKarti(k, { sid: s.id })).join("") || bos("Henüz ders kaydı yok.")}</div></div>
  </div>`;
}

/* ================================================================== */
/* Kabuk: menü, üst bar                                                 */
/* ================================================================== */
function menuTanimi() {
  const bek = (liste) => liste.filter(r => r.durum === "beklemede").length;
  const gecikmis = () => DB.students.filter(s => odemeOzeti(s).geciken > 0).length;
  if (ROLE === "yonetici") return [
    { baslik: null, ogeler: [["ozet","Dashboard","dashboard"]] },
    { baslik:"Eğitim", ogeler: [["ogrenciler","Öğrenciler","users"], ["ogretmenler","Öğretmenler","cap"], ["takvim","Ders Takvimi","calendar"], ["devam","Yoklama","check"], ["mufredat","Müfredat","book"], ["telafi","Telafi Talepleri","repeat", bek(DB.makeupRequests)], ["dersonay","Ders Atama","clipboard", bek(DB.dersAtamaTalepleri)]] },
    { baslik:"Finans", ogeler: [["finans","Finans & Taksit","wallet", gecikmis()], ["kart","Kafe Kartları","coffee"]] },
    { baslik:"Yapay Zeka", ogeler: [["eslestirme","AI Eşleştirme","sparkles", DB.students.filter(s => !s.teacherId).length], ["risk","AI Risk Analizi","shield"]] },
  ];
  if (ROLE === "sekreter") return [
    { baslik: null, ogeler: [["yeni","Yeni Kayıt","userplus"], ["ogrenciler","Öğrenciler","users"]] },
    { baslik:"Eğitim", ogeler: [["yoklama","Yoklama","check"], ["dersatama","Ders Atama","clipboard"], ["telafi","Telafi Talepleri","repeat", bek(DB.makeupRequests)]] },
    { baslik:"Finans", ogeler: [["finans","Tahsilat & Hatırlatma","wallet", gecikmis()], ["kart","Kafe Kartları","coffee"]] },
  ];
  if (ROLE === "ogretmen") return [{ baslik: null, ogeler: [["yoklama","Yoklama & Ders","check"], ["kayitlar","Ders Kayıtları","clipboard"], ["ogrencilerim","Öğrencilerim","users"], ["telafi","Telafi Planlama","repeat"]] }];
  if (ROLE === "ogrenci") return [{ baslik: null, ogeler: [["buhafta","Bu Hafta","home"], ["eserler","Eserlerim","music"], ["notlar","Geçmiş Notlar","trend"], ["kart","Kartım","coffee"], ["materyaller","Materyaller","book"], ["program","Programım","calendar"]] }];
  if (ROLE === "kasa") return [{ baslik: null, ogeler: [["satis","Kafe Kasası","coffee"]] }];
  if (ROLE === "veli") return [{ baslik: null, ogeler: [["ozet","Özet","home"], ["ders","Dersler & Devam","calendar"], ["gelisim","Ders Notları","trend"], ["odeme","Ödemeler","wallet"], ["kart","Kafe Kartı","coffee"]] }];
  return [];
}
function sidebarHtml() {
  const menu = menuTanimi();
  return `
  <div class="fixed inset-0 z-40 bg-black/60 transition-opacity lg:hidden ${MOBIL_MENU_ACIK ? "" : "pointer-events-none opacity-0"}" onclick="mobilMenuKapat()"></div>
  <aside class="fixed left-0 top-0 z-50 h-screen w-64 bg-card border-r border-line flex flex-col pt-safe pb-safe transform transition-transform duration-200 lg:translate-x-0 ${MOBIL_MENU_ACIK ? "translate-x-0" : "-translate-x-full"}">
    <div class="p-5 border-b border-line">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gold/20 text-gold flex items-center justify-center">${ikon("music","w-5 h-5")}</div>
        <div class="flex-1"><h1 class="font-display text-lg font-semibold text-gold leading-tight">7Sanat</h1><p class="text-xs text-mut">Afyon</p></div>
        <button onclick="mobilMenuKapat()" class="lg:hidden text-mut hover:text-neutral-100">${ikon("x","w-5 h-5")}</button>
      </div>
      ${staff("mt-3")}
    </div>
    <nav class="flex-1 overflow-y-auto py-4 px-3">
      ${menu.map(g => `${g.baslik ? `<p class="px-3 mt-5 mb-2 text-[11px] uppercase tracking-wider text-neutral-600">${esc(g.baslik)}</p>` : ""}
        <ul class="space-y-1">${g.ogeler.map(([id, ad, ik, n]) => `<li><button onclick="setTab('${id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-200 ${TABS[ROLE] === id ? "bg-gold/15 text-gold font-medium" : "text-mut hover:bg-accent hover:text-neutral-100"}">
          ${ikon(ik)}<span class="flex-1 text-left">${esc(ad)}</span>${n ? `<span class="text-[11px] px-1.5 py-0.5 rounded-full ${TABS[ROLE] === id ? "bg-gold/25" : "bg-gold/15 text-gold"}">${n}</span>` : ""}</button></li>`).join("")}</ul>`).join("")}
    </nav>
    <div class="p-4 border-t border-line">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gold/15 text-gold flex items-center justify-center text-xs font-semibold">${initials(USER.ad)}</div>
        <div class="min-w-0 flex-1"><p class="text-sm font-medium truncate">${esc(USER.ad)}</p><p class="text-xs text-mut truncate">${esc(USER.unvan)}</p></div>
      </div>
      ${ROLE === "yonetici" ? `<button onclick="sifirlaVeriler()" class="w-full text-left text-xs text-neutral-600 hover:text-mut mt-3">Demo verilerini sıfırla</button>` : ""}
      <p class="text-[10px] text-neutral-600 mt-2">${SUNUCU ? "● Sunucuya kaydediliyor" : "○ Çevrimdışı — bu tarayıcıda saklanıyor"}</p>
    </div>
  </aside>`;
}
function topBarHtml() {
  const bildirim = ROLE === "yonetici" ? DB.makeupRequests.filter(r => r.durum === "beklemede").length + DB.dersAtamaTalepleri.filter(r => r.durum === "beklemede").length
    : ROLE === "sekreter" ? DB.makeupRequests.filter(r => r.durum === "beklemede").length : 0;
  const hedef = ROLE === "yonetici" ? (DB.dersAtamaTalepleri.some(r => r.durum === "beklemede") ? "dersonay" : "telafi") : "telafi";
  return `<header class="sticky top-0 z-30 bg-card/80 backdrop-blur-md border-b border-line pt-safe"><div class="h-16 flex items-center justify-between px-4 sm:px-6">
    <div class="flex items-center gap-4 min-w-0">
      <button onclick="mobilMenuAc()" class="lg:hidden text-mut hover:text-neutral-100" aria-label="Menü">${ikon("menu","w-5 h-5")}</button>
      <div class="min-w-0"><h2 class="font-display text-lg font-semibold truncate">Hoşgeldiniz</h2><p class="text-xs text-mut truncate">${esc(USER.ad)}</p></div>
    </div>
    <div class="flex items-center gap-2">
      ${bildirim ? `<button onclick="setTab('${hedef}')" class="relative h-10 w-10 inline-flex items-center justify-center rounded-lg text-mut hover:text-gold hover:bg-accent" title="Bekleyen talepler">${ikon("bell")}<span class="absolute top-1.5 right-1.5 min-w-[16px] h-4 px-1 rounded-full bg-gold text-black text-[10px] font-bold flex items-center justify-center">${bildirim}</span></button>` : ""}
      <button onclick="cikisYap()" class="inline-flex items-center gap-2 h-9 rounded-md px-3 text-sm text-mut hover:text-red-400 hover:bg-accent">${ikon("logout")} <span class="hidden sm:inline">Çıkış</span></button>
    </div>
  </div></header>`;
}
function icerikHtml() {
  const tab = TABS[ROLE];
  if (ROLE === "yonetici") {
    const map = { ozet:adminOverviewHtml, ogrenciler:() => ogrenciListesiHtml("yonetici"), ogretmenler:teachersHtml, takvim:adminCalendarHtml, devam:adminAttendanceHtml, mufredat:mufredatHtml, telafi:telafiHtml, dersonay:adminLessonApprovalsHtml, finans:financeHtml, kart:kartlarHtml, eslestirme:adminAIMatchHtml, risk:adminAIRiskHtml };
    return (map[tab] || adminOverviewHtml)();
  }
  if (ROLE === "sekreter") {
    const map = { yeni:secNewStudentHtml, ogrenciler:() => ogrenciListesiHtml("sekreter"), yoklama:secAttendanceViewHtml, dersatama:secLessonAssignHtml, telafi:telafiHtml, finans:secFinanceRemindersHtml, kart:kartlarHtml };
    return (map[tab] || secNewStudentHtml)();
  }
  if (ROLE === "ogretmen") {
    const t = benimOgretmen(); if (!t) return card(bos("Öğretmen kaydınız bulunamadı."));
    const ogr = DB.students.filter(s => s.teacherId === t.id);
    if (tab === "kayitlar") return teacherRecordsHtml(ogr);
    if (tab === "telafi") return teacherMakeupHtml(ogr, t.id);
    if (tab === "ogrencilerim") return teacherStudentsHtml(ogr);
    return teacherAttendanceHtml(ogr);
  }
  if (ROLE === "kasa") return kasaHtml();
  if (ROLE === "veli") return veliPanelHtml();
  if (ROLE === "ogrenci") return ogrenciPanelHtml();
  return "";
}
/* Telefonda alt sekme çubuğu: en sık kullanılan 4 sayfa + "Menü" */
function altMenuHtml() {
  const ogeler = menuTanimi().flatMap(g => g.ogeler);
  if (ogeler.length <= 1) return "";
  const gorunen = ogeler.length <= 5 ? ogeler : ogeler.slice(0, 4);
  const aktifGorunur = gorunen.some(o => o[0] === TABS[ROLE]);
  const btn = (id, ad, ik, n, aktif, tik) => `<button onclick="${tik}" class="flex-1 flex flex-col items-center justify-center gap-1 py-2 min-w-0 ${aktif ? "text-gold" : "text-mut"}">
      <span class="relative">${ikon(ik, "w-5 h-5")}${n ? `<span class="absolute -top-1.5 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-gold text-black text-[10px] font-bold flex items-center justify-center">${n}</span>` : ""}</span>
      <span class="text-[10px] leading-tight pt-0.5 truncate max-w-full px-1">${esc(ad)}</span></button>`;
  return `<nav id="altMenu" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-card/95 backdrop-blur-md border-t border-line pb-safe">
    <div class="flex">${gorunen.map(([id, ad, ik, n]) => btn(id, ad.split(" ")[0] === "AI" ? ad : ad.replace(/ &.*| Kasası| Notları/, ""), ik, n, TABS[ROLE] === id, `setTab('${id}')`)).join("")}
    ${ogeler.length > 5 ? btn("", "Menü", "menu", 0, !aktifGorunur, "mobilMenuAc()") : ""}</div>
  </nav>`;
}
function toastHtml() {
  if (!TOAST) return "";
  setTimeout(() => { if (TOAST) TOAST.yeni = false; }, 0);
  const renk = TOAST.tur === "hata" ? "border-red-500/40 text-red-300" : TOAST.tur === "uyari" ? "border-yellow-500/40 text-yellow-300" : "border-green-500/40 text-green-300";
  return `<div style="bottom:calc(${USER ? "84px" : "16px"} + env(safe-area-inset-bottom))" class="fixed lg:!bottom-4 right-4 left-4 sm:left-auto z-[200] max-w-sm bg-card border ${renk} rounded-xl px-4 py-3 text-sm shadow-2xl ${TOAST.yeni ? "fade-in" : ""} flex items-start gap-3" id="toast">
    ${ikon(TOAST.tur === "hata" ? "alert" : "check","w-4 h-4 mt-0.5")}<span class="flex-1">${esc(TOAST.mesaj)}</span><button onclick="TOAST=null; render()" class="text-mut hover:text-neutral-100">${ikon("x","w-3.5 h-3.5")}</button></div>`;
}
function dashboardHtml() {
  return `${sidebarHtml()}
  <div class="lg:ml-64 min-h-screen">
    ${topBarHtml()}
    <main class="p-4 sm:p-6 max-w-[1400px] alt-bosluk lg:!pb-6">${icerikHtml()}</main>
  </div>
  ${altMenuHtml()}
  ${MODALLAR.map((m, i) => modalHtml(m, 60 + i * 10)).join("")}`;
}

/* ================================================================== */
/* Render — form değerleri ve odak korunur                              */
/* ================================================================== */
function render() {
  const app = document.getElementById("app");
  const eski = {};
  if (!FORM_TEMIZLE) app.querySelectorAll("input[id], select[id], textarea[id]").forEach(el => { if (el.type !== "range" && el.type !== "file" && el.type !== "checkbox") eski[el.id] = el.value; });
  FORM_TEMIZLE = false;
  const odak = document.activeElement && document.activeElement.id; let secim = null;
  try { if (odak) secim = [document.activeElement.selectionStart, document.activeElement.selectionEnd]; } catch (e) {}
  const kaydirmalar = [...app.querySelectorAll(".overflow-y-auto")].map(el => el.scrollTop);

  app.innerHTML = (NATIVE && !API_BASE) ? sunucuAyarHtml()
    : (NATIVE && SUNUCU_HATA === "baglanti") ? sunucuHataHtml()
    : (!USER || !DB) ? loginScreenHtml()
    : (USER.rol === "ogrenci" && USER.sifreDegistir) ? sifreDegistirHtml() : dashboardHtml();
  app.insertAdjacentHTML("beforeend", toastHtml());
  MODAL_ANIM = false;

  Object.entries(eski).forEach(([id, v]) => {
    const el = document.getElementById(id); if (!el || id.startsWith("ara_") || id === "girisKimlik" || id === "girisSifre") return;
    if (el.tagName === "SELECT") { if ([...el.options].some(o => o.value === v)) el.value = v; }
    else el.value = v;
  });
  [...app.querySelectorAll(".overflow-y-auto")].forEach((el, i) => { if (kaydirmalar[i]) el.scrollTop = kaydirmalar[i]; });
  if (odak) { const el = document.getElementById(odak); if (el && el.tagName !== "SELECT") { el.focus(); try { if (secim && secim[0] !== null) el.setSelectionRange(secim[0], secim[1]); } catch (e) {} } }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && MODALLAR.length) modalKapat(); });
window.addEventListener("focus", () => { if (USER) sunucudanYenile(); });

render();
initDb();
uygulamaKurulum();
</script>
