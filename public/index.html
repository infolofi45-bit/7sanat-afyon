  if (s === null || s === undefined) return "";

function tarihStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function bugun() { return tarihStr(new Date()); }
function simdi() { const d = new Date(); return `${tarihStr(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function tarihTR(s) { if (!s) return "-"; const [t, saat] = String(s).split(/[ T]/); const [y,m,g] = t.split("-"); return `${g}.${m}.${y}${saat ? " " + saat.slice(0,5) : ""}`; }
function haftaEtiketi(dateStr) {
  if (!dateStr) return "";
  const secilen = new Date(dateStr + "T00:00:00");
  const gunIndex = (secilen.getDay() + 6) % 7;
  const start = new Date(secilen); start.setDate(secilen.getDate() - gunIndex);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  if (start.getMonth() === end.getMonth()) return `${start.getDate()}-${end.getDate()} ${AY_TAM[start.getMonth()]}`;
  return `${start.getDate()} ${AY_KISA[start.getMonth()]}-${end.getDate()} ${AY_KISA[end.getMonth()]}`;
}
function datetimeGoster(v) { return v ? v.replace("T", " ") : ""; }
function gunAdi(dateStr) { if (!dateStr) return ""; return GUNLER[new Date(dateStr + "T00:00:00").getDay()]; }
function tarihEkle(dateStr, gun) { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + gun); return tarihStr(d); }
function ayEkle(dateStr, ay) {
  const d = new Date(dateStr + "T00:00:00"); const g = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + ay);
  const sonGun = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(g, sonGun)); return tarihStr(d);
}

  /* Kafe kartları: her öğrenciye bir kart, aynı numaradan 2 kopya (veli + öğrenci) */

  const tipler = ["silver","platinum","gold"];

    const harcamaSayisi = 2 + (i % 4);
    for (let h = 0; h < harcamaSayisi; h++) {

    }
  });

  const makeupRequests = [
    { id:"m1", studentId:"s2", ogretmenId:students.find(s=>s.id==="s2").teacherId, dersTarihi:"2026-06-11 17:00", sebep:"Sağlık raporu", onerilenTarih:"2026-06-14 16:00", durum:"beklemede" },

  ];

  ];
  const personel = [
    { email:"admin@7sanat.com", sifre:"admin123", rol:"yonetici", ad:"Serkan Bulut", unvan:"Kurum Müdürü" },
    { email:"sekreter@7sanat.com", sifre:"sekreter123", rol:"sekreter", ad:"Buse Yıldırım", unvan:"Sekreter" },
    { email:"kasa@7sanat.com", sifre:"kasa123", rol:"kasa", ad:"Kafe Kasası", unvan:"Kasa (POS)" },
  ];
  return { teachers, students, makeupRequests, dersAtamaTalepleri, kartlar, kartHareketleri, personel, surumVeri: 2 };
}

function odemeOzeti(s) {
  const n = Math.max(1, s.taksitSayisi || 1);
  const taksitTutari = Math.round(s.kayitUcreti / n);
  const odenen = (s.odemeler || []).reduce((a, p) => a + (Number(p.tutar) || 0), 0);
  const kalan = Math.max(0, s.kayitUcreti - odenen);
  const BUGUN = bugun();
  let kumulatif = 0; const plan = []; let geciken = 0, odenenTaksit = 0;
  for (let i = 0; i < n; i++) {
    const tutar = i === n - 1 ? s.kayitUcreti - taksitTutari * (n - 1) : taksitTutari;
    const onceki = kumulatif; kumulatif += tutar;
    const vade = ayEkle(s.kayitTarihi, i);
    let durum;
    if (odenen >= kumulatif) { durum = "ödendi"; odenenTaksit++; }
    else if (vade < BUGUN) { durum = "gecikti"; geciken++; }
    else if (odenen > onceki) durum = "kısmi";
    else durum = "bekliyor";
    plan.push({ no: i + 1, vade, tutar, durum, kalan: Math.max(0, Math.min(tutar, kumulatif - odenen)) });
  }
  const genel = kalan <= 0 ? "tamamlandı" : geciken > 0 ? "gecikmiş" : "güncel";
  const sonraki = plan.find(p => p.durum !== "ödendi");
  return { taksitTutari, odenen, kalan, plan, geciken, odenenTaksit, durum: genel, sonraki };
}
function devamOrani(list) {
  if (!list || list.length === 0) return null;
  return Math.round((list.filter((d) => d[1] === "var").length / list.length) * 100);
}
function yasGrubu(yas) { if (yas <= 6) return "5-6"; if (yas <= 10) return "7-10"; if (yas <= 14) return "11-14"; return "15-18"; }
function kartBul(no) { return DB.kartlar.find(k => k.no === no); }
function kartHareketleri(no) { return DB.kartHareketleri.filter(h => h.kartNo === no).sort((a,b)=>b.tarih.localeCompare(a.tarih)); }
function kartBakiye(no) { return DB.kartHareketleri.filter(h => h.kartNo === no).reduce((a, h) => a + (h.tur === "yukleme" ? h.tutar : -h.tutar), 0); }
function ogretmenAd(tid) { const t = DB.teachers.find(x => x.id === tid); return t ? t.ad : null; }

/* Dosya indirme: uygulamada telefonun paylaş menüsü açılır (WhatsApp, Drive, e-posta...) */
async function dosyaPaylas(dosyaAdi, blob) {
  const fs = eklenti("Filesystem"), paylas = eklenti("Share");
  if (!fs || !paylas) { toast("Bu cihazda dosya paylaşımı desteklenmiyor.", "hata"); return; }
  try {
    const b64 = await new Promise((ok, hata) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = hata; r.readAsDataURL(blob); });
    const sonuc = await fs.writeFile({ path: dosyaAdi, data: b64, directory: "CACHE" });
    await paylas.share({ title: dosyaAdi, url: sonuc.uri, dialogTitle: "Dosyayı paylaş" });
  } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast("Dosya paylaşılamadı: " + ((e && e.message) || e), "hata"); }
}
async function uygulamaKurulum() {

  const sb = eklenti("StatusBar");
  if (sb) { try { await sb.setStyle({ style: "DARK" }); await sb.setBackgroundColor({ color: "#0f131a" }); } catch (e) {} }
  const splash = eklenti("SplashScreen");
  if (splash) { try { await splash.hide(); } catch (e) {} }
  const app = eklenti("App");
  if (app) {
    // Android geri tuşu: önce açık pencereyi / menüyü kapat, sonra uygulamayı arka plana al
    app.addListener("backButton", () => {
      if (MODALLAR.length) modalKapat();

  }
}

async function callAI(system, user) {
  if (location.protocol === "file:" && !NATIVE) throw new Error("Yapay zeka için sunucu gerekli: klasörde 'npm start' çalıştırıp http://localhost:3000 adresinden açın.");
  const resp = await fetch(api("/api/ai"), { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ system, user }) });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || "İstek başarısız: " + resp.status);
  return data.text || "";
}
function parseJsonLoose(text) {
  const cleaned = text.replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf("{"), end = cleaned.lastIndexOf("}");
  if (start === -1 || end === -1) throw new Error("JSON bulunamadı");
  return JSON.parse(cleaned.slice(start, end + 1));
}

    try { const r = await fetch(api("/api/arsiv"), { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(kayit) }); if (r.ok) return; } catch (e) {}
  }
  let liste = []; try { liste = JSON.parse(lsGet(LS_ARSIV) || "[]"); } catch (e) {}
  liste.push(kayit); lsSet(LS_ARSIV, JSON.stringify(liste));
}
function toast(mesaj, tur) {
  TOAST = { mesaj, tur: tur || "ok", yeni: true }; clearTimeout(TOAST_ZAMAN);
  TOAST_ZAMAN = setTimeout(() => { TOAST = null; render(); }, 3500);
  setTimeout(render, 0);
}

function girisYap() {
  if (!DB) return;
  const kimlik = LOGIN_EMAIL.trim().toLowerCase(), sifre = LOGIN_SIFRE.trim();
  LOGIN_HATA = "";
  if (!kimlik || !sifre) { LOGIN_HATA = "E-posta/telefon ve şifre gerekli."; render(); return; }
  const p = DB.personel.find(x => x.email.toLowerCase() === kimlik && x.sifre === sifre);
  if (p) { oturumAc({ rol:p.rol, ad:p.ad, unvan:p.unvan }); render(); return; }
  const t = DB.teachers.find(x => (x.email||"").toLowerCase() === kimlik && x.sifre === sifre);
  if (t) { oturumAc({ rol:"ogretmen", ad:t.ad, unvan:`${t.brans} Öğretmeni`, teacherId:t.id }); render(); return; }
  if (sadeceRakam(kimlik).length >= 10) {
    const cocuk = DB.students.filter(s => s.veli && telEsit(s.veli.tel, kimlik));
    if (cocuk.length && cocuk.some(s => s.veli.sifre === sifre)) {
      oturumAc({ rol:"veli", ad:cocuk[0].veli.ad, unvan:"Veli", veliTel:cocuk[0].veli.tel }); VELI_COCUK = cocuk[0].id; render(); return;
    }
  }
  LOGIN_HATA = "Bilgiler hatalı. Lütfen kontrol edip tekrar deneyin."; render();

    kart: kart ? { ...kart, sonBakiye: kartBakiye(kart.no) } : null,
    kartHareketleri: kart ? kartHareketleri(kart.no) : [],

    dersAtamaTalepleri: DB.dersAtamaTalepleri.filter(r => r.studentId === sid),
  });
  DB.students = DB.students.filter(x => x.id !== sid);
  if (kart) { DB.kartlar = DB.kartlar.filter(k => k.no !== kart.no); DB.kartHareketleri = DB.kartHareketleri.filter(h => h.kartNo !== kart.no); }
  DB.makeupRequests = DB.makeupRequests.filter(r => r.studentId !== sid);

}

/* ---------- Öğretmen yönetimi ---------- */
function ogretmenFormAc(tid) { modalAc({ tip:"ogretmenForm", tid: tid || null }); }
function ogretmenDetayAc(tid) { modalAc({ tip:"ogretmenDetay", tid }); }
function ogretmenKaydet(tid) {
  const ad = val("oAd").trim(), brans = val("oBrans"), email = val("oEmail").trim().toLowerCase(), sifre = val("oSifre").trim();
  if (!ad || !brans || !email) { toast("Ad, branş ve e-posta zorunlu.", "hata"); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast("Geçerli bir e-posta girin.", "hata"); return; }
  const cakisma = DB.teachers.find(t => t.id !== tid && (t.email||"").toLowerCase() === email) || DB.personel.find(p => p.email.toLowerCase() === email);
  if (cakisma) { toast("Bu e-posta başka bir hesapta kullanılıyor.", "hata"); return; }
  const veri = {
    ad, brans, email,
    grup: grupDersiMi(brans) ? (val("oGrup").trim() || "Grup 1") : null,
    uzmanlik: val("oUzmanlik").trim() || BRANS_BILGI[brans].uzmanlik,
    tarz: val("oTarz").trim() || BRANS_BILGI[brans].tarz,
    yasAraligi: val("oYas").trim() || BRANS_BILGI[brans].yasAraligi,
    tecrube: Number(val("oTecrube")) || 0,
    tel: val("oTel").trim(), baslangic: val("oBaslangic"), not_: val("oNot").trim(),
  };
  if (tid) {
    const t = DB.teachers.find(x => x.id === tid);
    const bransDegisti = t.brans !== brans, grupDegisti = t.grup !== veri.grup;
    Object.assign(t, veri); if (sifre) t.sifre = sifre;
    DB.students.filter(s => s.teacherId === tid).forEach(s => {
      if (bransDegisti) { s.teacherId = null; s.grup = null; s.dersGunu = null; s.dersSaati = null; }
      else if (grupDegisti) s.grup = veri.grup;
    });
    if (USER && USER.teacherId === tid) USER.ad = ad;
    toast(bransDegisti ? "Öğretmen güncellendi. Branş değiştiği için eski öğrencilerin ataması kaldırıldı." : "Öğretmen bilgileri güncellendi.");
  } else {
    if (!sifre || sifre.length < 6) { toast("Yeni öğretmen için en az 6 karakterli şifre belirleyin.", "hata"); return; }
    DB.teachers.push({ id: yeniId("t"), ...veri, sifre, kurumYoklama: [] });
    toast(`${ad} öğretmen olarak eklendi. Giriş: ${email}`);
  }
  saveDb(); FORM_TEMIZLE = true; MODALLAR.pop(); render();
}
function ogretmenSilSor(tid) {
  const t = DB.teachers.find(x => x.id === tid); const n = DB.students.filter(s => s.teacherId === tid).length;
  modalAc({ tip:"onay", tehlike:true, baslik:`${t.ad} silinsin mi?`, mesaj: n ? `Bu öğretmenin ${n} öğrencisi var. Silindiğinde bu öğrenciler "atanmamış" duruma geçer ve ders saatleri boşalır.` : "Öğretmen kaydı ve giriş hesabı kaldırılır.", buton:"Öğretmeni sil", aksiyon:`ogretmenSil('${tid}')` });
}
function ogretmenSil(tid) {

  DB.students.filter(s => s.teacherId === tid).forEach(s => { s.teacherId = null; s.grup = null; s.dersGunu = null; s.dersSaati = null; });
  DB.teachers = DB.teachers.filter(x => x.id !== tid);

function kurumYoklamaEkle(tid, d) {

/* ---------- Excel ---------- */
function xlsIndir(dosyaAdi, govde) {
  const icerik = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>${govde}</body></html>`;
  const blob = new Blob(["﻿" + icerik], { type:"application/vnd.ms-excel" });
  if (NATIVE) { dosyaPaylas(dosyaAdi.endsWith(".xls") ? dosyaAdi : dosyaAdi + ".xls", blob); return; }
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = dosyaAdi.endsWith(".xls") ? dosyaAdi : dosyaAdi + ".xls";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function xlsTablo(baslik, headers, rows) {
  const h = (c) => esc(String(c === null || c === undefined || c === "" ? "-" : c));
  return `${baslik ? `<h3 style="font-family:sans-serif;">${esc(baslik)}</h3>` : ""}<table border="1"><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead>
    <tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${h(c)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}">Kayıt yok</td></tr>`}</tbody></table><br/>`;
}
function disaAktarMaliTablo() {
  const ozet = DB.students.map(s => { const o = odemeOzeti(s); return [s.ad, s.brans, s.veli.ad, telGoster(s.veli.tel), s.kayitUcreti, `${o.odenenTaksit}/${s.taksitSayisi}`, o.odenen, o.kalan, o.geciken, o.durum]; });
  const tahsilat = DB.students.flatMap(s => (s.odemeler||[]).map(p => [tarihTR(p.tarih), s.ad, p.tutar, p.yontem, p.alan, p.not_])).sort((a,b)=>b[0].localeCompare(a[0]));
  xlsIndir("mali_tablo", xlsTablo("Öğrenci Bazında Durum", ["Öğrenci","Branş","Veli","Telefon","Kayıt Ücreti","Taksit","Ödenen","Kalan","Geciken Taksit","Durum"], ozet)
    + xlsTablo("Tahsilat Kayıtları", ["Tarih","Öğrenci","Tutar","Yöntem","Tahsil Eden","Not"], tahsilat));
}
function disaAktarYoklama() {
  xlsIndir("yoklama_kayitlari", xlsTablo("", ["Öğrenci","Branş","Tarih","Durum"], DB.students.flatMap((s)=>s.devam.map((d)=>[s.ad, s.brans, tarihTR(d[0]), d[1] === "var" ? "Geldi" : "Gelmedi"]))));
}
function disaAktarKartlar() {
  xlsIndir("kafe_kartlari", xlsTablo("Kartlar", ["Kart No","Tip","Öğrenci","Veli","Bakiye","Durum"], DB.kartlar.map(k => { const s = ogrenci(k.studentId); return [kartNoGoster(k.no), KART_TIPLERI[k.tip].ad, s ? s.ad : "-", s ? s.veli.ad : "-", kartBakiye(k.no), k.aktif ? "Aktif" : "Donduruldu"]; }))
    + xlsTablo("Hareketler", ["Tarih","Kart No","Öğrenci","İşlem","Tutar","Açıklama","Kullanan Kopya","İşlemi Yapan"], [...DB.kartHareketleri].sort((a,b)=>b.tarih.localeCompare(a.tarih)).map(h => { const k = kartBul(h.kartNo); const s = k && ogrenci(k.studentId); return [tarihTR(h.tarih), kartNoGoster(h.kartNo), s ? s.ad : "-", h.tur === "yukleme" ? "Yükleme" : "Harcama", h.tutar, h.aciklama, h.kopya || "-", h.islemYapan]; })));
}
function disaAktarOgrenciDetay(sid) {
  const s = ogrenci(sid); if (!s) return;
  const o = odemeOzeti(s); const kart = s.kartNo ? kartBul(s.kartNo) : null;
  xlsIndir("ogrenci_" + slug(s.ad),
    xlsTablo("Genel Bilgiler", ["Alan","Değer"], [["Ad Soyad", s.ad], ["Yaş", s.yas], ["Branş", s.brans], ["Grup", s.grup || "Bireysel"], ["Seviye", s.seviye], ["Kayıt Tarihi", tarihTR(s.kayitTarihi)], ["Öğretmen", ogretmenAd(s.teacherId) || "Atanmadı"], ["Ders Günü/Saati", s.dersGunu ? `${s.dersGunu} ${s.dersSaati}` : "-"], ["İlgi Alanı", s.ilgiAlani], ["Beklenti", s.beklenti]])
    + xlsTablo("Veli", ["Alan","Değer"], [["Veli Adı", s.veli.ad], ["Telefon", telGoster(s.veli.tel)], ["E-posta", s.veli.email]])
    + xlsTablo("Taksit Planı", ["No","Vade","Tutar","Durum"], o.plan.map(p => [p.no, tarihTR(p.vade), p.tutar, p.durum]))
    + xlsTablo("Tahsilatlar", ["Tarih","Tutar","Yöntem","Tahsil Eden","Not"], (s.odemeler||[]).map(p => [tarihTR(p.tarih), p.tutar, p.yontem, p.alan, p.not_]))
    + xlsTablo("Kafe Kartı", ["Alan","Değer"], kart ? [["Kart No", kartNoGoster(kart.no)], ["Tip", KART_TIPLERI[kart.tip].ad], ["Bakiye", kartBakiye(kart.no)]] : [])
    + xlsTablo("Kart Hareketleri", ["Tarih","İşlem","Tutar","Açıklama","Kopya"], kart ? kartHareketleri(kart.no).map(h => [tarihTR(h.tarih), h.tur === "yukleme" ? "Yükleme" : "Harcama", h.tutar, h.aciklama, h.kopya || "-"]) : [])
    + xlsTablo("Veli Görüşme Notları", ["Soru","Cevap"], (s.veliSoruCevap||[]).map(qa => [qa[0], qa[1]]))
    + xlsTablo("Haftalık Gelişim Notları", ["Hafta","Not","Puan"], s.haftalikNotlar.map(n => [n[0], n[1], n[2]]))
    + xlsTablo("Devam Kayıtları", ["Tarih","Durum"], s.devam.map(d => [tarihTR(d[0]), d[1] === "var" ? "Geldi" : "Gelmedi"])));
}

/* ---------- Öğretmen işlemleri ---------- */
function toggleYoklama(sid, d) { YOKLAMA_TEMP[sid] = d; render(); }
function hepsiVar(ids) { ids.split(",").forEach(id => YOKLAMA_TEMP[id] = "var"); render(); }
function kaydetYoklama() {
  const ids = Object.keys(YOKLAMA_TEMP);
  if (!ids.length) { toast("Önce öğrencileri işaretleyin.", "hata"); return; }
  ids.forEach((sid) => {
    const s = ogrenci(sid);
    if (s) { s.devam = s.devam.filter(d => d[0] !== YOKLAMA_TARIH); s.devam.push([YOKLAMA_TARIH, YOKLAMA_TEMP[sid]]); s.devam.sort((a,b)=>a[0].localeCompare(b[0])); }
  });
  YOKLAMA_TEMP = {}; saveDb(); toast(`${tarihTR(YOKLAMA_TARIH)} yoklaması kaydedildi.`); render();
}
function kaydetGelisimNotu() {
  const sid = GELISIM_OGRENCI, not_ = val("gelisimNot").trim(), puan = Number(val("gelisimPuan"));
  if (!GELISIM_HAFTA || !not_) { toast("Lütfen hafta ve not alanlarını doldurun.", "hata"); return; }
  const s = ogrenci(sid); const hafta = haftaEtiketi(GELISIM_HAFTA);
  if (s) { s.haftalikNotlar = s.haftalikNotlar.filter(n => n[0] !== hafta); s.haftalikNotlar.push([hafta, not_, puan]); }
  saveDb(); FORM_TEMIZLE = true; toast("Gelişim notu kaydedildi."); render();
}
function gonderTelafiTalebi(teacherId) {
  const sid = val("telafiOgrenci"), dersTarihi = datetimeGoster(val("telafiDersTarihi")), sebep = val("telafiSebep").trim(), onerilenTarih = datetimeGoster(val("telafiOnerilenTarih"));
  if (!sid || !dersTarihi || !sebep || !onerilenTarih) { toast("Lütfen tüm alanları doldurun.", "hata"); return; }
  DB.makeupRequests.push({ id: yeniId("m"), studentId: sid, ogretmenId: teacherId, dersTarihi, sebep, onerilenTarih, durum:"beklemede" });
  saveDb(); FORM_TEMIZLE = true; toast("Telafi talebi sekretere iletildi."); render();
}
function telafiDurumDegistir(id, d) { const r = DB.makeupRequests.find((x) => x.id === id); if (r) r.durum = d; saveDb(); toast(`Telafi talebi ${d}.`); render(); }
function gonderDersAtamaTalebi() {
  const studentId = val("dersAtamaOgrenci"), teacherId = val("dersAtamaOgretmen"), tarih = datetimeGoster(val("dersAtamaTarihi")), not_ = val("dersAtamaNot").trim();
  if (!studentId || !teacherId || !tarih) { toast("Lütfen öğrenci, öğretmen ve ders tarihi/saatini seçin.", "hata"); return; }
  const s = ogrenci(studentId), t = DB.teachers.find(x => x.id === teacherId);
  if (s.brans !== t.brans) { toast(`Branş uyuşmuyor: öğrenci ${s.brans}, öğretmen ${t.brans}.`, "hata"); return; }
  DB.dersAtamaTalepleri.push({ id: yeniId("d"), studentId, teacherId, tarih, not_, durum:"beklemede" });
  saveDb(); FORM_TEMIZLE = true; toast("Ders atama talebi yöneticiye iletildi."); render();
}
function dersAtamaDurumDegistir(id, d) {
  const r = DB.dersAtamaTalepleri.find((x) => x.id === id); if (!r) return;
  r.durum = d;
  if (d === "onaylandı") {
    const s = ogrenci(r.studentId), t = DB.teachers.find((x) => x.id === r.teacherId);
    if (s && t) { const [tk, sk] = r.tarih.split(" "); s.teacherId = t.id; s.grup = t.grup || null; s.dersGunu = gunAdi(tk); s.dersSaati = sk || s.dersSaati; }
  }
  saveDb(); toast(`Talep ${d}.`); render();
}

/* ---------- Yeni öğrenci kaydı ---------- */
function yeniBransDegisti(b) { const u = document.getElementById("yeniUcret"); if (u && BRANS_BILGI[b]) u.value = BRANS_BILGI[b].ucret; }
function kaydetYeniOgrenci() {
  const ad = val("yeniAd").trim(), yas = Number(val("yeniYas")), brans = val("yeniBrans"), kayitTarihi = val("yeniTarih");
  const kayitUcreti = Number(val("yeniUcret")), taksitSayisi = Number(val("yeniTaksit"));
  const veliAd = val("yeniVeliAd").trim(), veliTel = val("yeniVeliTel").trim(), veliEmail = val("yeniVeliEmail").trim();
  const ilkOdeme = Number(val("yeniIlkOdeme")) || 0, ilkBakiye = Number(val("yeniIlkBakiye")) || 0;
  if (!ad || !yas || !kayitTarihi || !kayitUcreti || !veliAd || !veliTel) { toast("Lütfen * işaretli tüm alanları doldurun.", "hata"); return; }
  if (sadeceRakam(veliTel).length < 10) { toast("Veli telefonu en az 10 haneli olmalı.", "hata"); return; }
  if (ilkOdeme > kayitUcreti) { toast("Peşinat kayıt ücretinden fazla olamaz.", "hata"); return; }
  const veliSoruCevap = VELI_SORULARI.map((soru, i) => [soru, val("veliCevap" + i).trim()]).filter((qa) => qa[1]);
  const tel = sadeceRakam(veliTel).replace(/^(?!0)/, "0");
  const kardes = DB.students.find(s => s.veli && telEsit(s.veli.tel, tel));
  const veliSifre = kardes ? kardes.veli.sifre : sifreUret();
  const no = kartNoUret();
  const s = {
    id: yeniId("s"), ad, yas, brans, grup:null, kayitTarihi, kayitUcreti, taksitSayisi,
    odemeler: ilkOdeme > 0 ? [{ id: yeniId("o"), tarih: kayitTarihi, tutar: ilkOdeme, yontem: val("yeniIlkOdemeYontem"), not_:"Kayıt peşinatı", alan: USER.ad }] : [],
    teacherId:null, dersGunu:null, dersSaati:null,
    ilgiAlani: veliSoruCevap[0] ? veliSoruCevap[0][1] : "", beklenti: veliSoruCevap.length ? veliSoruCevap[veliSoruCevap.length-1][1] : "",
    seviye: val("yeniSeviye") || "Başlangıç", veliSoruCevap, haftalikNotlar:[], devam:[],
    veli: { ad: veliAd, tel, email: veliEmail, sifre: veliSifre }, kartNo: no,
  };
  DB.students.push(s);
  DB.kartlar.push({ no, tip: YENI_KART_TIP, studentId: s.id, olusturma: kayitTarihi, aktif: true });
  if (ilkBakiye > 0) DB.kartHareketleri.push({ id: yeniId("h"), kartNo: no, tarih: simdi(), tur:"yukleme", tutar: ilkBakiye, aciklama:"Açılış bakiyesi", kopya:null, islemYapan: USER.ad });
  saveDb(); FORM_TEMIZLE = true;
  modalAc({ tip:"kayitSonuc", sid: s.id, kardes: !!kardes });
}

/* ---------- AI ---------- */
function eslestirSec(sid) { AI.matchSecili = sid; AI.matchDurum = { loading:false, error:"", data:null }; render(); }
async function eslestirBul() {
  AI.matchDurum = { loading:true, error:"", data:null }; render();
  try { AI.matchDurum = { loading:false, error:"", data: await aiOgretmenEslestir(ogrenci(AI.matchSecili), DB.teachers) }; }
  catch (e) { AI.matchDurum = { loading:false, error:"Eşleştirme alınamadı: " + (e && e.message ? e.message : "bilinmeyen hata"), data:null }; }
  render();
}
async function analizEt(sid) {
  AI.risk[sid] = { loading:true }; render();
  try { AI.risk[sid] = { loading:false, data: await aiRiskAnaliz(ogrenci(sid)) }; }
  catch (e) { AI.risk[sid] = { loading:false, error:"Analiz alınamadı: " + (e && e.message ? e.message : "bilinmeyen hata") }; }
  render();
}

    <div class="min-w-0">
      <h1 class="font-display text-2xl font-bold text-neutral-50 tracking-tight">${esc(baslik)}${vurgu ? ` <span class="text-gold">${esc(vurgu)}</span>` : ""}</h1>
      ${alt ? `<p class="text-sm text-mut mt-1">${esc(alt)}</p>` : ""}
      <div class="mt-2 flex gap-0.5 w-48">${[0,1,2,3,4].map(()=>'<div class="staff flex-1"></div>').join("")}</div>
    </div>
    ${sag ? `<div class="flex flex-wrap gap-2">${sag}</div>` : ""}
  </div>`;
}
function card(inner, extra) { return `<div class="bg-card rounded-xl border border-line p-5 ${extra || ""}">${inner}</div>`; }
function cardBaslik(ik, t, sag) { return `<div class="flex items-center justify-between gap-3 mb-4"><h3 class="font-display text-lg font-semibold text-neutral-50 flex items-center gap-2">${ik ? `<span class="text-gold">${ikon(ik, "w-5 h-5")}</span>` : ""}${esc(t)}</h3>${sag || ""}</div>`; }
function statCard(ik, renk, label, value, sub, tik) {
  return `<div ${tik ? `onclick="${tik}"` : ""} class="bg-card rounded-xl p-4 sm:p-5 border border-line hover:border-gold/30 transition-all duration-300 hover:shadow-lg hover:shadow-gold/5 min-w-0 ${tik ? "cursor-pointer" : ""}">
    <div class="flex items-center gap-2 sm:gap-3 mb-2 sm:mb-3">
      <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg flex items-center justify-center shrink-0" style="background-color:${renk}20;color:${renk}">${ikon(ik, "w-4 h-4 sm:w-5 sm:h-5")}</div>
      <span class="text-xs sm:text-sm text-mut leading-tight">${esc(label)}</span>
    </div>
    <div class="text-lg sm:text-2xl font-display font-bold text-neutral-50 count-up truncate">${esc(value)}</div>
    ${sub ? `<p class="text-[11px] sm:text-xs text-mut mt-1 line-clamp-2">${esc(sub)}</p>` : ""}
  </div>`;
}
function satir(sol, sag, tik) { return `<div ${tik ? `onclick="${tik}"` : ""} class="flex items-center justify-between gap-3 p-3 bg-bg rounded-lg ${tik ? "hover:bg-accent cursor-pointer" : ""} transition-colors">${sol}${sag}</div>`; }
function bos(t) { return `<div class="text-center py-8 text-sm text-mut">${esc(t)}</div>`; }
function tablo(basliklar, satirlar, bosMesaj) {
  return `<div class="overflow-x-auto"><table class="w-full">
    <thead><tr class="text-left text-xs uppercase tracking-wider text-mut border-b border-line">${basliklar.map(b=>`<th class="px-4 py-3 font-medium whitespace-nowrap">${b}</th>`).join("")}</tr></thead>
    <tbody>${satirlar || `<tr><td colspan="${basliklar.length}">${bos(bosMesaj || "Kayıt bulunamadı.")}</td></tr>`}</tbody></table></div>`;
}
const TD = "px-4 py-3 text-sm";
function aramaKutusu(state, deger, ph) {
  return `<div class="relative w-full sm:w-64"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-mut">${ikon("search","w-4 h-4")}</span>
    <input id="ara_${state}" value="${esc(deger)}" oninput="durumSet('${state}', this.value)" placeholder="${esc(ph)}" class="${INP} pl-9" /></div>`;
}
function chipler(state, secili, secenekler) {
  return `<div class="flex flex-wrap gap-1.5">${secenekler.map(([v, t, n]) => `<button onclick="durumSet('${state}','${v}')" class="text-xs px-3 py-1.5 rounded-lg border transition ${secili === v ? "bg-gold/15 border-gold/40 text-gold" : "border-line text-mut hover:text-neutral-200 hover:bg-accent"}">${esc(t)}${n !== undefined ? ` <span class="opacity-70">${n}</span>` : ""}</button>`).join("")}</div>`;
}
function puanNoktalari(p) { return `<div class="flex items-center gap-1">${[1,2,3,4,5].map(i=>`<div class="w-2 h-2 rounded-full ${i <= p ? "bg-gold" : "bg-line"}"></div>`).join("")}<span class="text-xs text-gold ml-1">${p}/5</span></div>`; }
function devamSeridi(devam) {
  if (!devam.length) return '<p class="text-xs text-mut">Henüz yoklama kaydı yok.</p>';
  const son = devam.slice(-20);
  return `<div class="flex gap-1">${son.map(([t, d]) => `<div title="${tarihTR(t)}: ${d === "var" ? "Geldi" : "Gelmedi"}" class="h-3 flex-1 rounded-full ${d === "var" ? "bg-green-500" : "bg-red-500"}"></div>`).join("")}</div>
    <div class="flex justify-between text-xs text-mut mt-1"><span>${tarihTR(son[0][0])}</span><span>${tarihTR(son[son.length-1][0])}</span></div>`;
}

/* ---------- Kafe kartı görseli ---------- */
function kartGorsel(kart, kopya, sahip, kucuk) {
  const tip = KART_TIPLERI[kart.tip] || KART_TIPLERI.silver;
  return `<div class="kart relative rounded-2xl overflow-hidden shadow-xl w-full ${kucuk ? "max-w-[300px]" : "max-w-[340px]"} aspect-[1.586/1] select-none ${kart.aktif === false ? "grayscale opacity-60" : ""}" style="background:${tip.bg};color:${tip.yazi}">
    <div class="absolute inset-0 kart-parilti"></div>
    <div class="absolute inset-0 flex flex-col justify-between" style="padding:7cqw">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center min-w-0" style="gap:3cqw">
          <div class="rounded-lg flex items-center justify-center shrink-0" style="width:10cqw;height:10cqw;background:${tip.vurgu}22">${ikon("music","w-1/2 h-1/2")}</div>
          <div class="leading-tight min-w-0"><p class="font-display font-bold whitespace-nowrap" style="font-size:5cqw">7Sanat Kafe</p><p class="opacity-75 whitespace-nowrap" style="font-size:3.2cqw">Afyon Sanat Akademisi</p></div>
        </div>
        <span class="font-semibold uppercase rounded shrink-0" style="font-size:3.2cqw;letter-spacing:.2em;padding:.6cqw 2cqw;background:${tip.vurgu}26">${tip.ad}</span>
      </div>
      <div class="rounded-md" style="width:13cqw;height:9cqw;background:linear-gradient(135deg,#f5d77a,#b8923a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)"></div>
      <div>
        <p class="font-mono whitespace-nowrap" style="font-size:6.4cqw;letter-spacing:.08em">${kartNoGoster(kart.no)}</p>
        <div class="flex items-end justify-between gap-2" style="margin-top:1.5cqw">
          <p class="font-medium truncate" style="font-size:3.8cqw">${esc(sahip || "")}</p>
          <p class="font-semibold uppercase opacity-80 whitespace-nowrap" style="font-size:3cqw;letter-spacing:.15em">${esc(kopya)} KARTI</p>
        </div>
      </div>
    </div>
    ${kart.aktif === false ? '<div class="absolute inset-0 flex items-center justify-center"><span class="bg-black/70 text-white text-xs px-3 py-1 rounded">DONDURULDU</span></div>' : ""}
  </div>`;
}
function kartIkiKopya(kart, s) {
  return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 justify-items-center">
    ${kartGorsel(kart, "Veli", s ? s.veli.ad : "", true)}${kartGorsel(kart, "Öğrenci", s ? s.ad : "", true)}
  </div>`;
}
function hareketListesi(no, limit) {
  const liste = kartHareketleri(no).slice(0, limit || 999);
  if (!liste.length) return bos("Henüz kart hareketi yok.");
  return `<div class="space-y-2">${liste.map(h => satir(
    `<div class="flex items-center gap-3 min-w-0"><div class="w-8 h-8 rounded-lg flex items-center justify-center ${h.tur === "yukleme" ? "bg-green-400/15 text-green-400" : "bg-gold/15 text-gold"}">${ikon(h.tur === "yukleme" ? "wallet" : "coffee", "w-4 h-4")}</div>
      <div class="min-w-0"><p class="text-sm text-neutral-100 truncate">${esc(h.aciklama)}</p><p class="text-xs text-mut">${tarihTR(h.tarih)}${h.kopya ? ` · ${esc(h.kopya)} kartı` : ""}${h.islemYapan ? ` · ${esc(h.islemYapan)}` : ""}</p></div></div>`,
    `<span class="text-sm font-medium whitespace-nowrap ${h.tur === "yukleme" ? "text-green-400" : "text-neutral-200"}">${h.tur === "yukleme" ? "+" : "−"}${TL(h.tutar)}</span>`)).join("")}</div>`;
}

function adminOverviewHtml() {
  const { students, teachers } = DB;
  const bekleyenTelafi = DB.makeupRequests.filter(r => r.durum === "beklemede").length;
  const bekleyenAtama = DB.dersAtamaTalepleri.filter(r => r.durum === "beklemede").length;
  const ozetler = students.map(s => ({ s, o: odemeOzeti(s) }));
  const gecikenTaksit = ozetler.reduce((a, x) => a + x.o.geciken, 0);
  const buAy = bugun().slice(0, 7);
  const aylikTahsilat = students.reduce((a, s) => a + (s.odemeler||[]).filter(p => p.tarih.startsWith(buAy)).reduce((b, p) => b + p.tutar, 0), 0);
  const haftalikDers = students.filter(s => s.teacherId && s.dersGunu).length;
  const bransMap = {}; students.forEach((s) => (bransMap[s.brans] = (bransMap[s.brans] || 0) + 1));
  const maxBrans = Math.max(1, ...Object.values(bransMap));
  const risk = ozetler.map(({ s, o }) => ({ s, o, dev: s.devam.slice(-8).filter(d => d[1] === "yok").length }))
    .filter(x => x.dev >= 2 || x.o.geciken > 0).sort((a, b) => (b.dev + b.o.geciken * 2) - (a.dev + a.o.geciken * 2)).slice(0, 6);
  const toplamBakiye = DB.kartlar.reduce((a, k) => a + kartBakiye(k.no), 0);

  return `

  <div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4 mb-6">

    ${statCard("calendar", "#a78bfa", "Bu Hafta Ders", haftalikDers, "Planlı ders sayısı", "setTab('takvim')")}
    ${statCard("wallet", "#34d399", "Aylık Tahsilat", TL(aylikTahsilat), AY_TAM[new Date().getMonth()] + " ayı", "setTab('finans')")}
    ${statCard("alert", "#ef4444", "Geciken Taksit", gecikenTaksit, `${ozetler.filter(x=>x.o.geciken).length} öğrencide`, "FIN_FILTRE='gecikmiş'; setTab('finans')")}
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    ${card(`${cardBaslik("shield", "Bekleyen Onaylar")}
      <div class="space-y-3">
        ${satir('<span class="text-sm">Telafi Talepleri</span>', `<span class="bg-gold/20 text-gold text-sm font-medium px-2.5 py-0.5 rounded-full">${bekleyenTelafi}</span>`, "setTab('telafi')")}
        ${satir('<span class="text-sm">Ders Atama Talepleri</span>', `<span class="bg-gold/20 text-gold text-sm font-medium px-2.5 py-0.5 rounded-full">${bekleyenAtama}</span>`, "setTab('dersonay')")}
        ${satir('<span class="text-sm">Öğretmen Ataması Bekleyen Öğrenci</span>', `<span class="bg-gold/20 text-gold text-sm font-medium px-2.5 py-0.5 rounded-full">${students.filter(s=>!s.teacherId).length}</span>`, "setTab('eslestirme')")}
      </div>`)}
    ${card(`${cardBaslik("alert", "Risk Altındaki Öğrenciler")}
      <div class="space-y-2">${risk.map(({ s, o, dev }) => satir(
        `<div class="flex items-center gap-3 min-w-0"><div class="w-2 h-2 rounded-full shrink-0" style="background:${bransRenk(s.brans)}"></div><span class="text-sm truncate">${esc(s.ad)}</span><span class="text-xs text-mut">(${esc(s.brans)})</span></div>`,
        `<div class="flex items-center gap-2 text-xs whitespace-nowrap">${dev >= 2 ? `<span class="text-orange-400">${dev} devamsızlık</span>` : ""}${o.geciken ? `<span class="text-red-400">${o.geciken} geciken taksit</span>` : ""}</div>`,
        `ogrenciAc('${s.id}')`)).join("") || bos("Risk altında öğrenci yok.")}</div>`)}
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    ${card(`${cardBaslik("music", "Branş Dağılımı")}
      <div class="space-y-3">${Object.entries(bransMap).map(([b, c]) => `
        <div><div class="flex justify-between text-xs text-mut mb-1"><span>${esc(b)}</span><span>${c}</span></div>
        <div class="h-2.5 rounded-full bg-bg"><div class="h-2.5 rounded-full" style="width:${(c / maxBrans) * 100}%;background:${bransRenk(b)}"></div></div></div>`).join("")}</div>`)}
    ${card(`${cardBaslik("coffee", "Kafe Kartları")}

      ${satir('<span class="text-sm text-mut">Kartlardaki toplam bakiye</span>', `<span class="text-sm font-medium text-gold">${TL(toplamBakiye)}</span>`, "setTab('kart')")}`)}
  </div>`;
}

function ogrenciListesiHtml(rol) {
  const q = OGR_ARAMA.toLocaleLowerCase("tr");
  const liste = DB.students.filter(s => (!OGR_BRANS || s.brans === OGR_BRANS) && (!q || s.ad.toLocaleLowerCase("tr").includes(q) || s.veli.ad.toLocaleLowerCase("tr").includes(q) || sadeceRakam(s.veli.tel).includes(sadeceRakam(q) || "§")));
  const rows = liste.map((s) => {
    const o = odemeOzeti(s); const oran = devamOrani(s.devam);
    return `<tr onclick="ogrenciAc('${s.id}')" class="border-b border-line/60 cursor-pointer hover:bg-accent/50 transition">
      <td class="${TD}"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-semibold shrink-0" style="background:${bransRenk(s.brans)}20;color:${bransRenk(s.brans)}">${initials(s.ad)}</div><div><p class="text-neutral-50 font-medium">${esc(s.ad)}</p><p class="text-xs text-mut">${s.yas} yaş · ${esc(s.seviye)}</p></div></div></td>
      <td class="${TD}">${bransBadge(s.brans)} <span class="text-xs text-mut ml-1">${esc(s.grup || (grupDersiMi(s.brans) ? "" : "Bireysel"))}</span></td>
      <td class="${TD} text-neutral-200">${s.teacherId ? esc(ogretmenAd(s.teacherId)) : badge("warning", "Atanmadı")}</td>
      <td class="${TD} text-neutral-200 whitespace-nowrap">${s.dersGunu ? `${esc(s.dersGunu)} ${esc(s.dersSaati)}` : '<span class="text-mut">-</span>'}</td>
      <td class="${TD}">${oran === null ? '<span class="text-mut">-</span>' : badge(oran >= 90 ? "success" : oran >= 75 ? "warning" : "danger", "%" + oran)}</td>
      <td class="${TD}">${badge(ODEME_TONE[o.durum], o.durum)}</td>
      <td class="${TD} text-neutral-200">${esc(s.veli.ad)}<p class="text-xs text-mut">${telGoster(s.veli.tel)}</p></td>

  }).join("");
  const bransSay = (b) => DB.students.filter(s => s.brans === b).length;
  return `
  ${sayfaBaslik("Öğrenci", "Yönetimi", `${DB.students.length} kayıtlı öğrenci — detay, ödeme, kart ve kayıt silme için isme tıklayın`, rol === "sekreter" ? `<button onclick="setTab('yeni')" class="${BTN.p}">${ikon("userplus")} Yeni Kayıt</button>` : "")}
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 mb-4">
    ${chipler("OGR_BRANS", OGR_BRANS, [["", "Tümü", DB.students.length], ...BRANSLAR().map(b => [b, b, bransSay(b)])])}

  ${card(tablo(["Öğrenci","Branş","Öğretmen","Ders","Devam","Ödeme","Veli"], rows, "Aramaya uyan öğrenci yok."), "p-0 overflow-hidden")}`;
}

function financeHtml() {
  const ozetler = DB.students.map(s => ({ s, o: odemeOzeti(s) }));
  const toplamCiro = DB.students.reduce((a, s) => a + s.kayitUcreti, 0);
  const tahsil = ozetler.reduce((a, x) => a + x.o.odenen, 0);
  const kalan = ozetler.reduce((a, x) => a + x.o.kalan, 0);
  const gecikenTutar = ozetler.reduce((a, x) => a + x.o.plan.filter(p => p.durum === "gecikti").reduce((b, p) => b + p.kalan, 0), 0);
  const q = FIN_ARAMA.toLocaleLowerCase("tr");
  const liste = ozetler.filter(x => (FIN_FILTRE === "hepsi" || x.o.durum === FIN_FILTRE) && (!q || x.s.ad.toLocaleLowerCase("tr").includes(q) || x.s.veli.ad.toLocaleLowerCase("tr").includes(q)))
    .sort((a, b) => b.o.geciken - a.o.geciken);
  const say = (d) => ozetler.filter(x => x.o.durum === d).length;
  const rows = liste.map(({ s, o }) => `<tr class="border-b border-line/60 hover:bg-accent/40 transition">
      <td class="${TD} cursor-pointer whitespace-nowrap" onclick="ogrenciAc('${s.id}','odeme')"><p class="text-neutral-50 font-medium hover:text-gold">${esc(s.ad)}</p><p class="text-xs text-mut">${esc(s.brans)}</p></td>
      <td class="${TD} text-neutral-200">${TL(s.kayitUcreti)}</td>
      <td class="${TD}"><div class="flex items-center gap-2"><div class="w-20 h-1.5 rounded-full bg-bg"><div class="h-1.5 rounded-full bg-gold" style="width:${Math.min(100, (o.odenen / s.kayitUcreti) * 100)}%"></div></div><span class="text-xs text-mut">${o.odenenTaksit}/${s.taksitSayisi}</span></div></td>
      <td class="${TD} text-green-400">${TL(o.odenen)}</td>
      <td class="${TD} text-neutral-200">${TL(o.kalan)}</td>
      <td class="${TD} text-xs text-mut whitespace-nowrap">${o.sonraki ? `${tarihTR(o.sonraki.vade)} · ${TL(o.sonraki.kalan)}` : "-"}</td>
      <td class="${TD}">${badge(ODEME_TONE[o.durum], o.durum + (o.geciken ? ` (${o.geciken})` : ""))}</td>

function kartlarHtml() {
  const q = KART_ARAMA.toLocaleLowerCase("tr"); const qr = sadeceRakam(KART_ARAMA);
  const liste = DB.kartlar.map(k => ({ k, s: ogrenci(k.studentId), b: kartBakiye(k.no) }))
    .filter(({ k, s }) => !q || (s && (s.ad.toLocaleLowerCase("tr").includes(q) || s.veli.ad.toLocaleLowerCase("tr").includes(q))) || (qr && k.no.includes(qr)));
  const toplam = DB.kartlar.reduce((a, k) => a + kartBakiye(k.no), 0);
  const BUGUN = bugun();
  const bugunYukleme = DB.kartHareketleri.filter(h => h.tur === "yukleme" && h.tarih.startsWith(BUGUN)).reduce((a, h) => a + h.tutar, 0);

/* ================================================================== */
/* Kabuk: menü, üst bar                                                 */
/* ================================================================== */
function menuTanimi() {
  const bek = (liste) => liste.filter(r => r.durum === "beklemede").length;
  const gecikmis = () => DB.students.filter(s => odemeOzeti(s).geciken > 0).length;
  if (ROLE === "yonetici") return [
    { baslik: null, ogeler: [["ozet","Dashboard","dashboard"]] },
    { baslik:"Eğitim", ogeler: [["ogrenciler","Öğrenciler","users"], ["ogretmenler","Öğretmenler","cap"], ["takvim","Ders Takvimi","calendar"], ["devam","Yoklama","check"], ["telafi","Telafi Talepleri","repeat", bek(DB.makeupRequests)], ["dersonay","Ders Atama","clipboard", bek(DB.dersAtamaTalepleri)]] },
    { baslik:"Finans", ogeler: [["finans","Finans & Taksit","wallet", gecikmis()], ["kart","Kafe Kartları","coffee"]] },
    { baslik:"Yapay Zeka", ogeler: [["eslestirme","AI Eşleştirme","sparkles", DB.students.filter(s => !s.teacherId).length], ["risk","AI Risk Analizi","shield"]] },
  ];
  if (ROLE === "sekreter") return [
    { baslik: null, ogeler: [["yeni","Yeni Kayıt","userplus"], ["ogrenciler","Öğrenciler","users"]] },
    { baslik:"Eğitim", ogeler: [["yoklama","Yoklama","check"], ["dersatama","Ders Atama","clipboard"], ["telafi","Telafi Talepleri","repeat", bek(DB.makeupRequests)]] },
    { baslik:"Finans", ogeler: [["finans","Tahsilat & Hatırlatma","wallet", gecikmis()], ["kart","Kafe Kartları","coffee"]] },
  ];
  if (ROLE === "ogretmen") return [{ baslik: null, ogeler: [["yoklama","Yoklama Al","check"], ["ogrencilerim","Öğrencilerim","users"], ["gelisim","Haftalık Gelişim","trend"], ["telafi","Telafi Planlama","repeat"]] }];
  if (ROLE === "kasa") return [{ baslik: null, ogeler: [["satis","Kafe Kasası","coffee"]] }];
  if (ROLE === "veli") return [{ baslik: null, ogeler: [["ozet","Özet","home"], ["ders","Dersler & Devam","calendar"], ["gelisim","Gelişim Notları","trend"], ["odeme","Ödemeler","wallet"], ["kart","Kafe Kartı","coffee"]] }];
  return [];
}
function sidebarHtml() {
  const menu = menuTanimi();
  return `
  <div class="fixed inset-0 z-40 bg-black/60 transition-opacity lg:hidden ${MOBIL_MENU_ACIK ? "" : "pointer-events-none opacity-0"}" onclick="mobilMenuKapat()"></div>
  <aside class="fixed left-0 top-0 z-50 h-screen w-64 bg-card border-r border-line flex flex-col pt-safe pb-safe transform transition-transform duration-200 lg:translate-x-0 ${MOBIL_MENU_ACIK ? "translate-x-0" : "-translate-x-full"}">
    <div class="p-5 border-b border-line">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gold/20 text-gold flex items-center justify-center">${ikon("music","w-5 h-5")}</div>
        <div class="flex-1"><h1 class="font-display text-lg font-semibold text-gold leading-tight">7Sanat</h1><p class="text-xs text-mut">Afyon</p></div>
        <button onclick="mobilMenuKapat()" class="lg:hidden text-mut hover:text-neutral-100">${ikon("x","w-5 h-5")}</button>
      </div>
      ${staff("mt-3")}

    <nav class="flex-1 overflow-y-auto py-4 px-3">
      ${menu.map(g => `${g.baslik ? `<p class="px-3 mt-5 mb-2 text-[11px] uppercase tracking-wider text-neutral-600">${esc(g.baslik)}</p>` : ""}
        <ul class="space-y-1">${g.ogeler.map(([id, ad, ik, n]) => `<li><button onclick="setTab('${id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-200 ${TABS[ROLE] === id ? "bg-gold/15 text-gold font-medium" : "text-mut hover:bg-accent hover:text-neutral-100"}">
          ${ikon(ik)}<span class="flex-1 text-left">${esc(ad)}</span>${n ? `<span class="text-[11px] px-1.5 py-0.5 rounded-full ${TABS[ROLE] === id ? "bg-gold/25" : "bg-gold/15 text-gold"}">${n}</span>` : ""}</button></li>`).join("")}</ul>`).join("")}
    </nav>
    <div class="p-4 border-t border-line">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gold/15 text-gold flex items-center justify-center text-xs font-semibold">${initials(USER.ad)}</div>
        <div class="min-w-0 flex-1"><p class="text-sm font-medium truncate">${esc(USER.ad)}</p><p class="text-xs text-mut truncate">${esc(USER.unvan)}</p></div>

      ${ROLE === "yonetici" ? `<button onclick="sifirlaVeriler()" class="w-full text-left text-xs text-neutral-600 hover:text-mut mt-3">Demo verilerini sıfırla</button>` : ""}

    </div>
  </aside>`;
}
function topBarHtml() {
  const bildirim = ROLE === "yonetici" ? DB.makeupRequests.filter(r => r.durum === "beklemede").length + DB.dersAtamaTalepleri.filter(r => r.durum === "beklemede").length
    : ROLE === "sekreter" ? DB.makeupRequests.filter(r => r.durum === "beklemede").length : 0;
  const hedef = ROLE === "yonetici" ? (DB.dersAtamaTalepleri.some(r => r.durum === "beklemede") ? "dersonay" : "telafi") : "telafi";
  return `<header class="sticky top-0 z-30 bg-card/80 backdrop-blur-md border-b border-line pt-safe"><div class="h-16 flex items-center justify-between px-4 sm:px-6">
    <div class="flex items-center gap-4 min-w-0">
      <button onclick="mobilMenuAc()" class="lg:hidden text-mut hover:text-neutral-100" aria-label="Menü">${ikon("menu","w-5 h-5")}</button>
      <div class="min-w-0"><h2 class="font-display text-lg font-semibold truncate">Hoşgeldiniz</h2><p class="text-xs text-mut truncate">${esc(USER.ad)}</p></div>
    </div>
    <div class="flex items-center gap-2">
      ${bildirim ? `<button onclick="setTab('${hedef}')" class="relative h-10 w-10 inline-flex items-center justify-center rounded-lg text-mut hover:text-gold hover:bg-accent" title="Bekleyen talepler">${ikon("bell")}<span class="absolute top-1.5 right-1.5 min-w-[16px] h-4 px-1 rounded-full bg-gold text-black text-[10px] font-bold flex items-center justify-center">${bildirim}</span></button>` : ""}
      <button onclick="cikisYap()" class="inline-flex items-center gap-2 h-9 rounded-md px-3 text-sm text-mut hover:text-red-400 hover:bg-accent">${ikon("logout")} <span class="hidden sm:inline">Çıkış</span></button>

  </div></header>`;
}
function icerikHtml() {
  const tab = TABS[ROLE];
  if (ROLE === "yonetici") {
    const map = { ozet:adminOverviewHtml, ogrenciler:() => ogrenciListesiHtml("yonetici"), ogretmenler:teachersHtml, takvim:adminCalendarHtml, devam:adminAttendanceHtml, telafi:telafiHtml, dersonay:adminLessonApprovalsHtml, finans:financeHtml, kart:kartlarHtml, eslestirme:adminAIMatchHtml, risk:adminAIRiskHtml };
    return (map[tab] || adminOverviewHtml)();
  }
  if (ROLE === "sekreter") {
    const map = { yeni:secNewStudentHtml, ogrenciler:() => ogrenciListesiHtml("sekreter"), yoklama:secAttendanceViewHtml, dersatama:secLessonAssignHtml, telafi:telafiHtml, finans:secFinanceRemindersHtml, kart:kartlarHtml };
    return (map[tab] || secNewStudentHtml)();
  }
  if (ROLE === "ogretmen") {
    const t = benimOgretmen(); if (!t) return card(bos("Öğretmen kaydınız bulunamadı."));
    const ogr = DB.students.filter(s => s.teacherId === t.id);
    if (tab === "gelisim") return teacherWeeklyHtml(ogr);
    if (tab === "telafi") return teacherMakeupHtml(ogr, t.id);
    if (tab === "ogrencilerim") return teacherStudentsHtml(ogr);
    return teacherAttendanceHtml(ogr);
  }
  if (ROLE === "kasa") return kasaHtml();
  if (ROLE === "veli") return veliPanelHtml();
  return "";
}
/* Telefonda alt sekme çubuğu: en sık kullanılan 4 sayfa + "Menü" */
function altMenuHtml() {
  const ogeler = menuTanimi().flatMap(g => g.ogeler);
  if (ogeler.length <= 1) return "";
  const gorunen = ogeler.length <= 5 ? ogeler : ogeler.slice(0, 4);
  const aktifGorunur = gorunen.some(o => o[0] === TABS[ROLE]);
  const btn = (id, ad, ik, n, aktif, tik) => `<button onclick="${tik}" class="flex-1 flex flex-col items-center justify-center gap-1 py-2 min-w-0 ${aktif ? "text-gold" : "text-mut"}">
      <span class="relative">${ikon(ik, "w-5 h-5")}${n ? `<span class="absolute -top-1.5 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-gold text-black text-[10px] font-bold flex items-center justify-center">${n}</span>` : ""}</span>
      <span class="text-[10px] leading-tight pt-0.5 truncate max-w-full px-1">${esc(ad)}</span></button>`;
  return `<nav id="altMenu" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-card/95 backdrop-blur-md border-t border-line pb-safe">
    <div class="flex">${gorunen.map(([id, ad, ik, n]) => btn(id, ad.split(" ")[0] === "AI" ? ad : ad.replace(/ &.*| Kasası| Notları/, ""), ik, n, TABS[ROLE] === id, `setTab('${id}')`)).join("")}
    ${ogeler.length > 5 ? btn("", "Menü", "menu", 0, !aktifGorunur, "mobilMenuAc()") : ""}</div>
  </nav>`;
}
function toastHtml() {
  if (!TOAST) return "";
  setTimeout(() => { if (TOAST) TOAST.yeni = false; }, 0);
  const renk = TOAST.tur === "hata" ? "border-red-500/40 text-red-300" : TOAST.tur === "uyari" ? "border-yellow-500/40 text-yellow-300" : "border-green-500/40 text-green-300";
  return `<div style="bottom:calc(${USER ? "84px" : "16px"} + env(safe-area-inset-bottom))" class="fixed lg:!bottom-4 right-4 left-4 sm:left-auto z-[200] max-w-sm bg-card border ${renk} rounded-xl px-4 py-3 text-sm shadow-2xl ${TOAST.yeni ? "fade-in" : ""} flex items-start gap-3" id="toast">
    ${ikon(TOAST.tur === "hata" ? "alert" : "check","w-4 h-4 mt-0.5")}<span class="flex-1">${esc(TOAST.mesaj)}</span><button onclick="TOAST=null; render()" class="text-mut hover:text-neutral-100">${ikon("x","w-3.5 h-3.5")}</button></div>`;
}
function dashboardHtml() {
  return `${sidebarHtml()}
  <div class="lg:ml-64 min-h-screen">
    ${topBarHtml()}
    <main class="p-4 sm:p-6 max-w-[1400px] alt-bosluk lg:!pb-6">${icerikHtml()}</main>
  </div>
  ${altMenuHtml()}
  ${MODALLAR.map((m, i) => modalHtml(m, 60 + i * 10)).join("")}`;
}

/* ================================================================== */
/* Render — form değerleri ve odak korunur                              */
/* ================================================================== */
function render() {
  const app = document.getElementById("app");
  const eski = {};
  if (!FORM_TEMIZLE) app.querySelectorAll("input[id], select[id], textarea[id]").forEach(el => { if (el.type !== "range") eski[el.id] = el.value; });
  FORM_TEMIZLE = false;
  const odak = document.activeElement && document.activeElement.id; let secim = null;
  try { if (odak) secim = [document.activeElement.selectionStart, document.activeElement.selectionEnd]; } catch (e) {}
  const kaydirmalar = [...app.querySelectorAll(".overflow-y-auto")].map(el => el.scrollTop);

  app.innerHTML = (NATIVE && !API_BASE) ? sunucuAyarHtml()
    : (NATIVE && SUNUCU_HATA === "baglanti") ? sunucuHataHtml()
    : (!USER || !DB) ? loginScreenHtml() : dashboardHtml();
  app.insertAdjacentHTML("beforeend", toastHtml());
  MODAL_ANIM = false;

  Object.entries(eski).forEach(([id, v]) => {
    const el = document.getElementById(id); if (!el || id.startsWith("ara_") || id === "girisKimlik" || id === "girisSifre") return;
    if (el.tagName === "SELECT") { if ([...el.options].some(o => o.value === v)) el.value = v; }
    else el.value = v;
  });
  [...app.querySelectorAll(".overflow-y-auto")].forEach((el, i) => { if (kaydirmalar[i]) el.scrollTop = kaydirmalar[i]; });
  if (odak) { const el = document.getElementById(odak); if (el && el.tagName !== "SELECT") { el.focus(); try { if (secim && secim[0] !== null) el.setSelectionRange(secim[0], secim[1]); } catch (e) {} } }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && MODALLAR.length) modalKapat(); });
window.addEventListener("focus", () => { if (USER) sunucudanYenile(); });

render();
initDb();
uygulamaKurulum();
</script>
